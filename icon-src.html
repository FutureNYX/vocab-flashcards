<!doctype html>
<!-- Source for the app icon. Rendered to PNG by make-icons.ps1; iOS ignores SVG
     for apple-touch-icon, so the artwork has to be rasterised at each size.
     Same Fraunces V as the cards, dark ink on the leaf green of the accent. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{
    font-family:'Fraunces'; src:url('fonts/fraunces-latin.woff2') format('woff2');
    font-weight:400 700; font-style:normal;
  }
  html,body{margin:0; width:512px; height:512px;}
  body{
    background:#9DBE79;
    display:grid; place-items:center;
  }
  span{
    font-family:'Fraunces'; font-variation-settings:'opsz' 144; font-weight:600;
    font-size:340px; line-height:1; color:#12160E;
    /* the V's optical centre sits slightly above the box centre */
    transform:translateY(-8px);
  }
</style>
</head>
<body><span>V</span></body>
</html>
