<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141910">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vocab</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<style>
/* Functional build: the look is deliberately plain for now. Fonts and palette
   come from the live app so it doesn't feel foreign. */
@font-face{font-family:'Fraunces';src:url(../fonts/fraunces-latin.woff2) format('woff2');font-weight:100 900;font-display:swap;}
@font-face{font-family:'Manrope';src:url(../fonts/manrope-latin.woff2) format('woff2');font-weight:200 800;font-display:swap;}
@font-face{font-family:'Manrope';src:url(../fonts/manrope-cyrillic.woff2) format('woff2');font-weight:200 800;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
:root{
  --bg:#141910; --card:#1C2317; --ink:#ECE6D6; --bright:#FFFBEF; --muted:#A8A48F; --line:#D8CBA8;
  --accent:#C7A45C; --good:#7FBF8E; --bad:#D88A78;
  --display:'Fraunces', Georgia, serif; --sans:'Manrope', system-ui, sans-serif;
  color-scheme:dark;
}
html, body, *{ -webkit-tap-highlight-color:transparent !important; }
:focus:not(:focus-visible){ outline:none; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); }
body{ display:flex; flex-direction:column; padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0); }
button{ font:inherit; color:inherit; cursor:pointer; }
.top{ display:flex; justify-content:space-between; align-items:center; height:52px; flex:none; }
.icon{ background:none; border:0; font-size:22px; width:44px; height:44px; color:var(--muted); }
.icon:disabled{ opacity:.3; }
.progress{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
main{ flex:1; display:flex; flex-direction:column; min-height:0; }
.card{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 20px;
  display:flex; flex-direction:column; gap:16px; overflow-y:auto; color:var(--ink); }
.instr{ font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); line-height:1.4; }
.cue{ font-family:var(--display); font-size:25px; line-height:1.38; color:var(--bright); font-variation-settings:'opsz' 30; }
.cue.ru{ font-family:var(--sans); font-weight:500; font-size:23px; }
.cue s{ color:var(--muted); text-decoration-thickness:2px; }
.gap{ display:inline-block; min-width:3.5em; border-bottom:2px solid var(--line); }
.pos{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.mine{ font-size:17px; color:var(--ink); border-left:2px solid var(--accent); padding-left:12px; }
.word{ font-family:var(--display); font-size:38px; line-height:1.1; color:var(--bright); font-variation-settings:'opsz' 96; }
.word.long{ font-size:30px; }
.sent{ font-family:var(--display); font-size:20px; line-height:1.45; font-variation-settings:'opsz' 24; }
.sent b, .hl{ color:var(--accent); font-weight:600; }
.ru-line{ font-size:17px; color:var(--muted); }
.list{ display:flex; flex-direction:column; gap:6px; font-size:16px; }
.note{ font-size:15px; color:var(--muted); line-height:1.5; }
.trap{ font-size:15px; color:var(--bad); }
.hint{ font-size:22px; letter-spacing:.08em; color:var(--accent); font-variant-numeric:tabular-nums; }
.clip img{ max-width:100%; max-height:170px; border-radius:8px; display:block; }
.spacer{ flex:1; }
.actions{ display:flex; gap:10px; flex:none; padding:14px 0 16px; }
.btn{ flex:1; min-height:56px; border-radius:14px; border:1px solid var(--line); background:transparent; font-size:17px; font-weight:700; }
.btn.primary{ background:var(--line); color:#141910; }
.btn.good{ border-color:var(--good); color:var(--good); }
.btn.bad{ border-color:var(--bad); color:var(--bad); }
.btn.ghost{ flex:0 0 auto; padding:0 18px; color:var(--muted); border-color:rgba(216,203,168,.35); }
.btn:disabled{ opacity:.35; }
input[type=text], textarea{ width:100%; font:inherit; font-size:20px; padding:14px; border-radius:12px; border:1px solid var(--line); background:#10140C; color:var(--bright); }
textarea{ min-height:96px; resize:none; }
.opts{ display:flex; flex-direction:column; gap:10px; }
.opt{ min-height:54px; border-radius:12px; border:1px solid var(--line); background:transparent; font-size:19px; font-family:var(--display); }
.opt.right{ border-color:var(--good); color:var(--good); }
.opt.wrong{ border-color:var(--bad); color:var(--bad); }
.verdict{ font-size:18px; font-weight:700; }
.verdict.ok{ color:var(--good); } .verdict.no{ color:var(--bad); }
.timer{ font-family:var(--display); font-size:64px; text-align:center; color:var(--bright); font-variant-numeric:tabular-nums; }
.chk{ display:flex; align-items:center; gap:12px; font-size:20px; font-family:var(--display); padding:10px 0; }
.chk input{ width:26px; height:26px; accent-color:var(--good); }
.home{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; text-align:center; }
.home h1{ font-family:var(--display); font-size:40px; margin:0; font-weight:600; }
.home p{ margin:0; color:var(--muted); font-size:16px; line-height:1.5; }
.stages{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
.stages b{ display:block; font-size:20px; color:var(--ink); font-variant-numeric:tabular-nums; }
[hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="top">
  <button class="icon" id="exit" aria-label="Stop">&#10005;</button>
  <span class="progress" id="prog"></span>
  <button class="icon" id="undo" aria-label="Undo last answer" disabled>&#8634;</button>
</div>
<main id="main"></main>

<script src="../words.js"></script>
<script src="../contexts.js"></script>
<script src="content.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
const E = window.VocabEngine;
const KEY = 'vocab.v3';            // this app's own record
const OLD_KEY = 'vocab.main.v2';   // the live app's record: read once, never written
const $ = id => document.getElementById(id);
const main = $('main');
const POS = {adj:'adjective', adv:'adverb', v:'verb', n:'noun', prep:'preposition', conj:'conjunction', phrase:'phrase', idiom:'idiom'};
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const marked = s => esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>');
const struck = s => esc(s).replace(/\[([^\]]+)\]/g, '<s>$1</s>');
// a run of underscores is a gap; a letter in front of it ("e_______") stays as the clue
const gapped = s => esc(s).replace(/([A-Za-z]?)(_{2,})/g, (m, l, u) => l ? `<span class="gap">${l}</span>` : '<span class="gap"></span>');

/* ---------- deck ---------- */
const C = window.CONTENT || {words:{}, global:{}};
const DECK = (window.WORDS || []).map(w => Object.assign({
  word: w.word, pos: w.part_of_speech, pos_full: POS[String(w.part_of_speech).toLowerCase()] || w.part_of_speech,
  def: w.definition, ru: w.russian_synonyms, ru_def: w.russian_definition, en: w.english_synonyms,
  ex: w.example, contexts: (window.CONTEXTS && window.CONTEXTS[w.word]) || [w.example],
  themes: (C.global.word_themes || {})[w.word] || []
}, C.words[w.word] || {}));

/* ---------- storage ---------- */
let S;
function load(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  S = E.repair(raw, Date.now());
  if(!S.importedAt){
    let old = null;
    try{ old = JSON.parse(localStorage.getItem(OLD_KEY)); }catch(e){}
    if(old) E.importOld(S, old, DECK.map(d => d.word), Date.now());
    else S.importedAt = Date.now();
  }
  save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- sound and clips ---------- */
const audio = new Audio(); audio.preload = 'auto';
function say(text){
  audio.src = '../audio/' + slug(text) + '.mp3';
  audio.onerror = () => {
    try{ const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; speechSynthesis.speak(u); }catch(e){}
  };
  const p = audio.play(); if(p && p.catch) p.catch(() => {});
}
let GIFS = {};
fetch('../gifs.json').then(r => r.ok ? r.json() : {}).then(j => { GIFS = j || {}; }).catch(() => {});
const clip = word => GIFS[word] ? `<div class="clip"><img alt="" src="${esc(GIFS[word])}"></div>` : '';

/* ---------- session ---------- */
let sess = null, card = null, shownAt = 0, hintsUsed = 0, undoStack = [];

function home(){
  sess = null; card = null; undoStack = [];
  $('undo').disabled = true; $('exit').hidden = true; $('prog').textContent = '';
  const probe = new E.Session(S, DECK, C.global, {});
  const sm = probe.summary();
  const names = ['new','meeting','recalling','using','owned','free'];
  main.innerHTML = `<div class="home">
    <h1>Vocab</h1>
    <p>${sm.due ? `${sm.due} word${sm.due === 1 ? '' : 's'} to practise today.` : 'Nothing due right now.'}<br>The app chooses everything. Just follow each card.</p>
    <div class="stages">${sm.byStage.map((n, i) => `<span><b>${n}</b>${names[i]}</span>`).join('')}</div>
  </div>
  <div class="actions"><button class="btn primary" id="go">Start</button></div>`;
  $('go').onclick = () => start(false);
}

function start(extra){
  S = E.repair(S, Date.now());
  sess = new E.Session(S, DECK, C.global, {extra});
  $('exit').hidden = false;
  next();
}

function next(){
  save();
  card = sess.next();
  hintsUsed = 0;
  if(!card) return finished();
  $('prog').textContent = sess.done ? `${sess.done} done · ${sess.queue.length} to go` : `${sess.queue.length + 1} cards`;
  render();
}

function snapshot(){
  undoStack.push({S: JSON.stringify(S), queue: JSON.stringify(sess.queue), learn: JSON.stringify(sess.learn), done: sess.done, item: sess.current && sess.current.item, tail: sess.tailAdded});
  if(undoStack.length > 20) undoStack.shift();
  $('undo').disabled = false;
}
function undo(){
  const u = undoStack.pop(); if(!u) return;
  S = JSON.parse(u.S); sess.S = S;
  sess.queue = JSON.parse(u.queue); sess.learn = JSON.parse(u.learn); sess.done = u.done; sess.tailAdded = u.tail;
  if(u.item) sess.queue.unshift(u.item);
  $('undo').disabled = !undoStack.length;
  next();
}
$('undo').onclick = undo;
$('exit').onclick = () => { save(); home(); };

function answer(res){
  stopHints();
  snapshot();
  sess.answer(res);
  next();
}

function finished(){
  save();
  const sm = sess.summary();
  $('exit').hidden = true;
  main.innerHTML = `<div class="home">
    <h1>Done</h1>
    <p>${sm.tomorrow ? `${sm.tomorrow} word${sm.tomorrow === 1 ? '' : 's'} come back tomorrow.` : 'Come back tomorrow.'}<br>Sleep is part of it: new words settle overnight.</p>
  </div>
  <div class="actions"><button class="btn ghost" id="more">Keep going</button><button class="btn primary" id="back">Close</button></div>`;
  $('back').onclick = home;
  $('more').onclick = () => start(true);
}

/* ---------- rendering ---------- */
function render(){
  const k = card.kind;
  if(k === 'intro') return renderIntro();
  if(k === 'recall') return card.typed ? renderTyped() : renderSay();
  if(k === 'hook') return renderHook();
  if(k === 'personal-ask') return renderPersonalAsk();
  if(k === 'checkin') return renderCheckin();
  if(k === 'speak') return renderSpeak();
  if(k === 'carry') return renderCarry();
}

function cueHTML(){
  const t = card.type;
  if(t === 'upgrade') return `<div class="cue">${struck(card.cue)}</div>`;
  if(t === 'contrast') return `<div class="cue">${gapped(card.cue)}</div><div class="note">One of: ${card.options.map(esc).join(' · ')}</div>`;
  if(t === 'cloze' || t === 'colloc' || (t === 'probe' && /_{2,}/.test(card.cue))) return `<div class="cue">${gapped(card.cue)}</div>`;
  if(t === 'ru') return `<div class="cue ru">${esc(card.cue)}</div>`;
  if(t === 'personal') return `<div class="cue">${gapped(card.cue)}</div><div class="mine">You said: ${esc(card.mine)}</div>`;
  return `<div class="cue">${esc(card.cue)}</div>`;
}
function answerHTML(){
  const e = card.entry;
  let sent = '';
  if(card.answerSentence){
    sent = card.answerSentence.includes('*') ? marked(card.answerSentence)
      : esc(card.answerSentence).replace(new RegExp(esc(e.word), 'i'), m => `<b>${m}</b>`);
  }
  return `<div class="word${e.word.length > 16 ? ' long' : ''}">${esc(e.word)}</div>
    ${sent ? `<div class="sent">${sent}</div>` : ''}
    ${card.stage <= 1 && e.ru ? `<div class="ru-line">${esc(e.ru)}</div>` : ''}
    ${card.type === 'contrast' && e.nuance ? `<div class="note">${esc(e.nuance)}</div>` : ''}
    ${clip(e.word)}`;
}

/* Hints are never asked for: they appear on their own when the learner is slow,
   timed against their own speed on this kind of card. */
let hintTimers = [], resumed = false;
function startHints(){
  stopHints();
  const times = sess.hintTimes(card);
  times.forEach((ms, i) => hintTimers.push(setTimeout(() => {
    hintsUsed = i + 1;
    const el = $('hint'); if(el) el.textContent = card.hints[i];
  }, ms)));
}
function stopHints(){ hintTimers.forEach(clearTimeout); hintTimers = []; }
/* Time spent with the app in the background isn't thinking time. */
document.addEventListener('visibilitychange', () => { if(document.hidden) resumed = true; });

function renderSay(){
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      ${cueHTML()}
      <div class="pos">${esc(card.pos || '')}</div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="actions"><button class="btn primary" id="show">Show</button></div>`;
  shownAt = performance.now(); resumed = false;
  startHints();
  $('show').onclick = () => {
    stopHints();
    const latency = performance.now() - shownAt, noSpeed = resumed;
    say(card.entry.word);
    main.innerHTML = `<div class="card">
        ${answerHTML()}
        <div class="spacer"></div>
        <div class="note">Got it means you said this word, in any form, before you tapped Show.</div>
      </div>
      <div class="actions">
        <button class="btn bad" id="no">Missed</button>
        <button class="btn good" id="yes">Got it</button>
      </div>`;
    $('no').onclick = () => answer({ok:false, latency, noSpeed, hints: hintsUsed});
    $('yes').onclick = () => answer({ok:true, latency, noSpeed, hints: hintsUsed});
  };
}

function renderTyped(){
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      ${cueHTML()}
      <div class="pos">${esc(card.pos || '')}</div>
      <input type="text" id="typed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <div class="hint" id="hint"></div>
    </div>
    <div class="actions"><button class="btn primary" id="check">Check</button></div>`;
  shownAt = performance.now(); resumed = false;
  startHints();
  const inp = $('typed'); setTimeout(() => inp.focus(), 50);
  let checked = false;
  const check = () => {
    if(checked) return; checked = true;
    stopHints();
    const latency = performance.now() - shownAt, noSpeed = resumed;
    const r = E.checkTyped(card.entry, inp.value), typedText = inp.value.trim();
    say(card.entry.word);
    const ok = r !== 'wrong';
    main.innerHTML = `<div class="card">
        <div class="verdict ${r === 'right' ? 'ok' : 'no'}">${r === 'right' ? 'Right' : r === 'close' ? `Nearly. You typed “${esc(typedText)}”` : typedText ? `You typed “${esc(typedText)}”` : 'The word was'}</div>
        ${answerHTML()}
      </div>
      <div class="actions"><button class="btn primary" id="nx">Next</button></div>`;
    $('nx').onclick = () => answer({ok, close: r === 'close', latency, noSpeed, hints: hintsUsed, typed: true});
  };
  $('check').onclick = check;
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') check(); });
}

function renderIntro(){
  const e = card.entry;
  const reveal = () => {
    say(e.word);
    const cols = (e.collocations || []).map(c => `<div>${esc(c.chunk)}</div>`).join('');
    main.innerHTML = `<div class="card">
        <div class="instr">Say it out loud three times${e.gesture ? ', doing the movement' : ''}.</div>
        <div class="word${e.word.length > 16 ? ' long' : ''}">${esc(e.word)}</div>
        <div class="ru-line">${esc(e.ru || '')}</div>
        <div class="sent">${marked(card.anchor || e.ex || '')}</div>
        ${e.gesture ? `<div class="note">Movement: ${esc(e.gesture)}</div>` : ''}
        ${cols ? `<div class="list"><div class="pos">Goes with</div>${cols}</div>` : ''}
        ${e.ru_trap ? `<div class="trap">${esc(e.ru_trap)}</div>` : ''}
        ${e.nuance ? `<div class="note">${esc(e.nuance)}</div>` : ''}
        ${clip(e.word)}
      </div>
      <div class="actions"><button class="btn ghost" id="again">Hear it</button><button class="btn primary" id="nx">Next</button></div>`;
    $('again').onclick = () => say(e.word);
    $('nx').onclick = () => answer({});
  };
  if(card.meetOnly || !card.cue) return reveal();
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      <div class="cue">${esc(card.cue)}</div>
      <div class="pos">${esc(e.pos_full || '')}</div>
    </div>
    <div class="actions"><button class="btn primary" id="show">Show the word</button></div>`;
  $('show').onclick = reveal;
}

function renderHook(){
  const e = card.entry;
  say(e.word);
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      <div class="word">${esc(e.word)}</div>
      <div class="sent">${esc(card.hook)}</div>
      <div class="ru-line">${esc(e.ru || '')}</div>
    </div>
    <div class="actions"><button class="btn primary" id="nx">Next</button></div>`;
  $('nx').onclick = () => answer({});
}

function renderPersonalAsk(){
  const e = card.entry;
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      <div class="word">${esc(e.word)}</div>
      <div class="cue">${esc(card.question)}</div>
      <textarea id="txt" placeholder="A name, a moment, a line"></textarea>
      <div class="note">Stays on this phone. It will come back later as a clue.</div>
    </div>
    <div class="actions"><button class="btn primary" id="nx">Save</button></div>`;
  $('nx').onclick = () => answer({text: $('txt').value});
}

function renderCheckin(){
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      <div class="cue">${esc(card.prompt)}</div>
    </div>
    <div class="actions"><button class="btn" id="no">Not yet</button><button class="btn good" id="yes">Yes</button></div>`;
  $('no').onclick = () => answer({yes:false});
  $('yes').onclick = () => answer({yes:true});
}

function renderCarry(){
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      <div class="word">${esc(card.word)}</div>
      <div class="cue">${esc(card.plan)}</div>
      <div class="note">Tomorrow the app will ask if it came out.</div>
    </div>
    <div class="actions"><button class="btn primary" id="nx">OK</button></div>`;
  $('nx').onclick = () => answer({});
}

function renderSpeak(){
  main.innerHTML = `<div class="card">
      <div class="instr">${esc(card.instruction)}</div>
      <div class="cue">${esc(card.prompt)}</div>
      <div class="list">${card.words.map(w => `<div class="hl" style="font-size:22px;font-family:var(--display)">${esc(w)}</div>`).join('')}</div>
      <div class="timer" id="t">${card.seconds}</div>
    </div>
    <div class="actions"><button class="btn primary" id="go">Start speaking</button></div>`;
  $('go').onclick = () => {
    $('go').disabled = true;
    let left = card.seconds;
    const iv = setInterval(() => {
      left--; if($('t')) $('t').textContent = left;
      if(left <= 0){ clearInterval(iv); tick(); }
    }, 1000);
    $('go').textContent = 'Finish early';
    $('go').disabled = false;
    $('go').onclick = () => { clearInterval(iv); tick(); };
  };
  function tick(){
    main.innerHTML = `<div class="card">
        <div class="instr">Tap the words you managed to use.</div>
        ${card.words.map((w, i) => `<label class="chk"><input type="checkbox" id="w${i}" value="${esc(w)}">${esc(w)}</label>`).join('')}
      </div>
      <div class="actions"><button class="btn primary" id="nx">Done</button></div>`;
    $('nx').onclick = () => answer({used: card.words.filter((w, i) => $('w' + i).checked)});
  }
}

/* ---------- offline ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope: './', updateViaCache: 'none'}).catch(() => {});
}

load();
home();
</script>
</body>
</html>
