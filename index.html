<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="theme-color" content="#0A120D">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>Vocab</title>
<style>
/* Vocab v3. The learning lives in app/engine.js; this file is the room it
   happens in: a pine wood at night, one lantern, and words that light up like
   fireflies when you catch them. Design notes that matter for memory:
   - while you are recalling, nothing moves near the cue (no fireflies, no
     glow): attention goes to the retrieval, not the decoration;
   - on the answer, the cue stays on screen, dimmed, above the lit word, so the
     link being trained (this situation -> this word) is seen as one thing;
   - the cue, the word and the buttons are always in the same place. */
@font-face{font-family:'Fraunces'; src:url('fonts/fraunces-latin.woff2') format('woff2');
  font-weight:400 700; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2212,U+FEFF,U+FFFD;}
@font-face{font-family:'Manrope'; src:url('fonts/manrope-latin.woff2') format('woff2');
  font-weight:400 800; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Manrope'; src:url('fonts/manrope-cyrillic.woff2') format('woff2');
  font-weight:400 800; font-display:swap; unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Manrope'; src:url('fonts/manrope-cyrillic-ext.woff2') format('woff2');
  font-weight:400 800; font-display:swap; unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;}

:root{
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:'Fraunces',ui-serif,Georgia,'Times New Roman',serif;
  /* the pine palette of the live app: a pine-green room and one cream light */
  --bg:#0A120D; --card:#14231A; --card-2:#1B2D22;
  --text:#C4D3C8; --bright:#E3EBE5; --muted:#71857A; --line:#223528; --ink:#DCE8DF; --ink-muted:#7F9486;
  --edge:rgba(220,232,223,.14);
  --light:#EBCB82; --light-top:#FFF0C9; --on-light:#0E1710;
  --miss:#B79E68;
  --lamp:rgba(235,203,130,.13);
  --glow-word:0 0 8px rgba(235,203,130,.55), 0 0 26px rgba(235,203,130,.35);
  --pool:radial-gradient(closest-side, rgba(235,203,130,.16), rgba(235,203,130,.075) 50%, rgba(235,203,130,0));
  --pad-top:max(10px, env(safe-area-inset-top));
  --pad-bottom:max(14px, env(safe-area-inset-bottom));
}
html, body, *{ -webkit-tap-highlight-color:transparent !important; }
:focus:not(:focus-visible){ outline:none; }
:focus-visible{ outline:2px solid var(--light); outline-offset:3px; }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; touch-action:manipulation; overscroll-behavior:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0; }
[hidden]{ display:none !important; }

/* ---------- the sky ---------- */
.sky{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; contain:strict; }
.sky i{ position:absolute; border-radius:50%; background:#E4EFE6; opacity:var(--o);
  animation:star var(--t) ease-in-out var(--d) infinite; }
@keyframes star{ 0%,100%{opacity:calc(var(--o) * .18)} 50%{opacity:var(--o)} }

.screen{ position:fixed; inset:0; display:none; flex-direction:column; z-index:1;
  padding:var(--pad-top) 14px var(--pad-bottom); }
.screen.on{ display:flex; }

/* ---------- fireflies ---------- */
.ff{ position:absolute; width:3px; height:3px; border-radius:50%; background:#F6E6A8;
  box-shadow:0 0 6px 2px rgba(246,230,168,.5); opacity:var(--o,.7); pointer-events:none; }
.ff.small{ width:2px; height:2px; box-shadow:0 0 5px 1.5px rgba(246,230,168,.45); }

/* ---------- home: a lantern over the woods, and a jar of what you've caught ---------- */
#home{ cursor:pointer; overflow:hidden; align-items:center; text-align:center; padding-left:16px; padding-right:16px; }
.woods{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.woods .trees{ position:absolute; left:0; bottom:0; width:100%; height:46%; display:block; }
.woods .cone{ position:absolute; left:-15%; right:-15%; top:0; bottom:0;
  background:radial-gradient(55% 62% at 50% calc(var(--pad-top) + 40px), rgba(242,216,146,.17), transparent 72%); }
.lantern{ position:absolute; left:50%; top:calc(var(--pad-top) - 6px); width:44px; margin-left:-22px;
  transform-origin:50% 0; filter:drop-shadow(0 0 20px rgba(242,216,146,.7)); }
.lantern svg{ display:block; width:44px; height:78px; }
.home-hero{ position:relative; margin-top:118px; }
.title{ margin:0; font-family:var(--serif); font-variation-settings:'opsz' 144; font-size:46px; font-weight:600;
  letter-spacing:-.008em; color:var(--bright); text-shadow:0 0 26px rgba(235,203,130,.35); }
.subtitle{ margin-top:10px; color:#C9B783; font-family:var(--serif); font-variation-settings:'opsz' 24; font-size:17px; }
.jar{ position:relative; width:112px; height:152px; margin:34px auto 0; flex:0 0 auto; }
.jar svg{ position:absolute; inset:0; width:100%; height:100%; }
.caught{ position:relative; margin-top:18px; font-family:var(--serif); font-size:15px; color:var(--muted);
  font-variant-numeric:tabular-nums; line-height:1.6; }
.caught b{ font-weight:600; color:var(--text); }
.tap{ position:relative; margin-top:auto; margin-bottom:34px; color:var(--muted); font-size:14px; }

/* ---------- study ---------- */
#study{ padding-left:12px; padding-right:12px; }
.top{ display:flex; align-items:center; justify-content:space-between; height:56px; flex:0 0 auto; }
.icon-btn{ width:56px; height:56px; display:grid; place-items:center; color:var(--muted); font-size:28px; }
.icon-btn:disabled{ opacity:.25; }
.left{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }

.card-wrap{ flex:1 1 auto; position:relative; margin:6px 0 12px; min-height:0; }
.card{ position:absolute; inset:0; background:var(--card); border:1px solid var(--edge); border-radius:24px;
  color:var(--ink); display:flex; flex-direction:column; overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.45), inset 0 0 44px rgba(0,0,0,.25);
  background-image:linear-gradient(162deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.01) 34%, rgba(0,0,0,0) 52%, rgba(0,0,0,.22) 100%); }
/* the card is lit only once there is something to light: the answer */
.card.lit{ background-image:radial-gradient(80% 42% at 50% 46%, var(--lamp), transparent 72%),
  linear-gradient(162deg, rgba(255,255,255,.05) 0%, rgba(0,0,0,0) 52%, rgba(0,0,0,.22) 100%); }
.card-body{ flex:1; display:flex; flex-direction:column; padding:26px 24px 22px; min-height:0; overflow-y:auto;
  -webkit-overflow-scrolling:touch; }
.card.lit .card-body{ padding-bottom:76px; }   /* lets the last line scroll clear of the speaker */
.instr{ font-family:var(--serif); font-variation-settings:'opsz' 18; font-style:italic; font-size:16px;
  line-height:1.4; color:#C9B783; }
.stage{ flex:1 0 auto; min-height:calc(100% - 44px); display:flex; flex-direction:column; gap:14px; padding:18px 0; }
/* centred when it fits, top-aligned when it doesn't: auto margins give way to overflow, justify-content:center would push content up under the instruction */
.stage > :first-child{ margin-top:auto; } .stage > :last-child{ margin-bottom:auto; }
.cue{ font-family:var(--serif); font-variation-settings:'opsz' 30; font-size:25px; line-height:1.4;
  color:var(--bright); font-weight:500; letter-spacing:-.003em; }
.cue.ru{ font-family:var(--sans); font-size:22px; font-weight:500; line-height:1.4; }
.cue s{ color:var(--ink-muted); text-decoration-thickness:1.5px; text-decoration-color:rgba(201,183,131,.7); }
.gap{ display:inline-block; min-width:3.4em; border-bottom:1.5px solid rgba(235,203,130,.6); color:var(--light);
  font-weight:600; padding:0 2px; }
.pos{ color:var(--ink-muted); font-family:var(--serif); font-variation-settings:'opsz' 24; font-size:16px; }
.mine{ font-size:16px; line-height:1.45; color:var(--ink); border-left:1.5px solid rgba(235,203,130,.5); padding-left:12px; }
.options{ font-size:15px; color:var(--ink-muted); }
.options b{ color:var(--ink); font-weight:600; }
.hint{ min-height:30px; font-family:var(--serif); font-size:24px; letter-spacing:.14em; color:var(--light);
  text-shadow:0 0 12px rgba(235,203,130,.45); }
.hint span{ animation:ignite .9s ease-out; display:inline-block; }
/* the Hint button: only offered once you have been on a card a while, never pressed for you */
.hint-btn{ display:block; margin:8px 0 0; font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:.06em;
  color:var(--light); text-shadow:none; background:none; border:1px solid rgba(235,203,130,.45); border-radius:999px;
  padding:6px 16px; cursor:pointer; animation:heardIn .4s ease-out; }

/* the answer: the cue steps back, the word lights up */
.answered .cue{ font-size:18px; color:var(--ink-muted); line-height:1.4; }
.answered .cue.ru{ font-size:17px; }
.answered .gap{ color:var(--ink-muted); border-color:rgba(127,148,134,.5); }
.word-wrap{ position:relative; align-self:flex-start; }
.word{ position:relative; font-family:var(--serif); font-variation-settings:'opsz' 144; font-size:42px; font-weight:600;
  line-height:1.08; letter-spacing:-.01em; color:var(--light-top); text-shadow:var(--glow-word); word-break:break-word; }
.word.long{ font-size:32px; } .word.longer{ font-size:26px; line-height:1.18; }
.word.ignite{ animation:ignite 1s ease-out; }
@keyframes ignite{ 0%{opacity:0; text-shadow:none; filter:blur(3px);} 35%{opacity:1; filter:none;} 100%{opacity:1;} }
.sent{ font-size:18px; line-height:1.5; color:var(--bright); font-weight:500; }
/* the word in its sentence is lit, not coloured: white, in a pool of light */
.sent b{ font-weight:inherit; color:var(--bright); padding:12px 20px; margin:0 -20px; background:var(--pool);
  text-shadow:0 0 14px rgba(235,203,130,.30); -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.ru-line{ font-size:16px; color:var(--ink-muted); }
.note{ font-size:14px; line-height:1.5; color:var(--ink-muted); }
.trap{ font-size:14px; line-height:1.5; color:#D9B779; }
.trap b, .note b{ font-weight:600; color:var(--ink); }
.verdict{ font-size:15px; font-weight:700; letter-spacing:.01em; }
.verdict.ok{ color:var(--light); } .verdict.no{ color:var(--miss); }
.clip{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.clip img{ max-width:100%; max-height:150px; border-radius:10px; display:block; }
.credit{ font-size:11px; color:var(--ink-muted); }
.chunks{ display:flex; flex-direction:column; gap:4px; font-size:16px; color:var(--ink); }
.chunks .lbl{ font-family:var(--serif); font-style:italic; font-size:14px; color:var(--ink-muted); }
/* Below the fold: everything that is not the word itself. Memory takes in
   little at once, so the screen shows the cue and the word; the rest is there
   for anyone who scrolls. */
.more{ display:flex; flex-direction:column; gap:16px; border-top:1px solid var(--line); padding:22px 0 8px; }
.more-cue{ text-align:center; color:var(--ink-muted); opacity:.55; font-size:20px; line-height:1; }
.rule{ font-size:12.5px; line-height:1.45; color:var(--ink-muted); text-align:center; padding:6px 58px 0; }
.speak-btn{ position:absolute; right:14px; bottom:14px; width:50px; height:50px; border-radius:50%;
  background:var(--card-2); border:1px solid var(--edge); display:grid; place-items:center; }
.speak-btn svg{ width:22px; height:22px; fill:var(--ink); }

input[type=text], textarea{ width:100%; font:inherit; font-size:20px; padding:14px 16px; border-radius:14px;
  border:1px solid var(--edge); background:var(--card-2); color:var(--bright); }
input[type=text]:focus, textarea:focus{ outline:none; border-color:rgba(235,203,130,.55); }
textarea{ min-height:96px; resize:none; font-size:18px; }

/* the buttons under the card */
.actions{ flex:0 0 auto; display:flex; gap:10px; min-height:62px; align-items:stretch; }
.btn-main{ flex:1; background:var(--card-2); color:var(--ink); border:1px solid var(--edge);
  font-weight:650; font-size:17px; padding:16px; border-radius:16px; }
.btn-ghost{ flex:0 0 auto; padding:0 20px; color:var(--muted); font-size:15px; border-radius:16px; }
/* the judgement is two words, dim and lit: no boxes, the whole half is the tap target */
.ans{ flex:1; display:grid; place-items:center; font-size:19px; font-weight:650; border-radius:16px; }
.ans.miss{ color:var(--light); opacity:.55; }
.ans.got{ color:var(--light-top); text-shadow:0 0 6px rgba(235,203,130,.9), 0 0 20px rgba(235,203,130,.6), 0 0 40px rgba(235,203,130,.35); }
/* say it out loud: "Say it" sits right of Show, where the thumb is, lit as the main way to answer;
   listening, the mic glows like a lantern */
.say-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:9px; border-radius:16px;
  background:var(--light); color:var(--on-light); font-weight:700; font-size:17px; padding:16px;
  box-shadow:0 0 18px rgba(235,203,130,.28); }
.say-btn svg{ width:22px; height:22px; fill:var(--on-light); }
.say-btn.on{ animation:micGlow 1.4s ease-in-out infinite; }
.say-btn:disabled{ opacity:.6; }
.say-tip{ font-size:12.5px; line-height:1.45; color:var(--ink-muted); text-align:center; padding:6px 20px 0; }
/* the live mic sits on the card, bottom right under the thumb, with a word to its left */
.card-body.has-mic{ padding-bottom:90px; }
.mic-wrap{ position:absolute; right:16px; bottom:16px; display:flex; align-items:center; gap:12px; }
.mic-lbl{ font-size:14px; font-weight:600; color:var(--ink-muted); }
.mic-round{ width:60px; height:60px; border-radius:50%; display:grid; place-items:center; background:var(--light);
  box-shadow:0 0 16px rgba(235,203,130,.3); }
.mic-round svg{ width:26px; height:26px; fill:var(--on-light); }
.mic-wrap.on .mic-lbl{ color:var(--light); }
.mic-wrap.on .mic-round{ animation:micGlow 1.4s ease-in-out infinite; }
.heard .said.live{ display:block; white-space:nowrap; overflow:hidden; max-width:100%; }
.mic-btn{ flex:0 0 62px; display:grid; place-items:center; border-radius:50%; background:var(--card-2); border:1px solid var(--edge); }
.mic-btn svg{ width:26px; height:26px; fill:var(--light); }
.mic-btn.on{ background:var(--light); border-color:var(--light-top); box-shadow:0 0 18px rgba(235,203,130,.55); animation:micGlow 1.4s ease-in-out infinite; }
.mic-btn.on svg{ fill:var(--on-light); }
.mic-btn:disabled{ opacity:.5; }
@keyframes micGlow{ 0%,100%{box-shadow:0 0 10px rgba(235,203,130,.35)} 50%{box-shadow:0 0 26px rgba(235,203,130,.75)} }
.x-btn{ font-size:22px; padding:0 22px; }
.ans.got[id="enter"]{ font-size:34px; }
.tester-btn{ position:absolute; top:calc(var(--pad-top, 10px) + 10px); right:14px; z-index:6; cursor:pointer;
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  border:1px solid currentColor; border-radius:999px; padding:6px 11px; background:none; }
.tester-btn.on{ color:var(--light); }
#study.tester .left::after{ content:' · tester'; color:var(--light); }
/* Tester: the answer as blanks, one line per word, each as long as its word; what you say fills them */
.blanks{ display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:10px 14px; margin-top:16px; }
.blank{ display:inline-block; min-width:var(--w); height:38px; padding:0 4px; border-bottom:2px solid var(--muted);
  font-family:var(--serif); font-variation-settings:'opsz' 36; font-size:26px; line-height:36px; color:var(--bright);
  text-align:center; white-space:nowrap; transition:color .2s, border-color .2s; }
.blank.filled{ animation:heardIn .25s ease-out; }
.blank.ok{ color:var(--light); border-bottom-color:var(--light); text-shadow:0 0 12px rgba(235,203,130,.5); }
.blank.miss{ color:var(--ink-muted); }
.heard{ min-height:24px; margin-top:6px; font-size:15px; color:var(--ink-muted); text-align:center; }
.heard .said{ font-family:var(--serif); font-variation-settings:'opsz' 36; font-size:26px; color:var(--bright); }
.heard .said.flash{ display:inline-block; animation:heardIn .35s ease-out; }
.heard .said.ok{ color:var(--light); }
.heard .well{ margin-top:8px; font-size:17px; font-weight:700; color:var(--light); animation:heardIn .35s ease-out; }
.heard .again{ margin-top:6px; font-size:13px; color:var(--ink-muted); }
@keyframes heardIn{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:none;} }
.heard .listening{ color:var(--light); animation:pulse 1.6s ease-in-out infinite; }
.heard .dots{ display:inline-flex; gap:7px; }
.heard .dots i{ width:7px; height:7px; border-radius:50%; background:var(--light); animation:updot 1.1s ease-in-out infinite; }
.heard .dots i:nth-child(2){ animation-delay:.15s; } .heard .dots i:nth-child(3){ animation-delay:.3s; }

/* Speak: a ring of light that runs down */
.ring{ position:relative; width:150px; height:150px; margin:8px auto 0; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .n{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--serif); font-size:44px;
  color:var(--bright); font-variant-numeric:tabular-nums; }
.words3{ display:flex; flex-wrap:wrap; gap:8px 18px; }
.words3 span{ font-family:var(--serif); font-size:22px; color:var(--light-top); text-shadow:0 0 14px rgba(235,203,130,.4); }
.chk{ display:flex; align-items:center; gap:14px; font-family:var(--serif); font-size:22px; padding:12px 0; color:var(--ink);
  border-bottom:1px solid var(--line); }
.chk input{ width:24px; height:24px; accent-color:#EBCB82; }

/* ---------- done ---------- */
#done{ justify-content:center; align-items:center; text-align:center; gap:10px; overflow:hidden; }
#done .big{ font-family:var(--serif); font-variation-settings:'opsz' 96; font-size:32px; font-weight:600; color:var(--bright);
  text-shadow:0 0 26px rgba(235,203,130,.3); }
#done .sub{ color:var(--muted); font-size:15px; line-height:1.55; max-width:320px; margin-bottom:22px; }
#done .row{ display:flex; gap:10px; width:100%; max-width:420px; }
#done .flies{ position:absolute; inset:0; pointer-events:none; }

/* ---------- plus, request sheet, updates ---------- */
.fab{ position:fixed; right:18px; bottom:calc(var(--pad-bottom) + 14px); z-index:40; width:58px; height:58px; border-radius:50%;
  background:var(--card-2); border:1px solid var(--edge); display:grid; place-items:center;
  font-size:31px; font-weight:300; line-height:1; color:var(--ink); box-shadow:0 4px 14px rgba(0,0,0,.28); }
.update-pill{ position:fixed; left:16px; bottom:calc(var(--pad-bottom) + 16px); display:flex; align-items:center; gap:8px; z-index:60;
  background:var(--light); color:var(--on-light); font-size:13px; font-weight:700; padding:10px 15px; border-radius:22px;
  box-shadow:0 6px 18px rgba(0,0,0,.28); }
.update-pill i{ width:7px; height:7px; border-radius:50%; background:var(--on-light); animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }
.updating{ position:fixed; inset:0; z-index:80; background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.updating p{ margin:14px 0 0; font-family:var(--serif); font-size:26px; font-weight:600; }
.updating span{ font-size:14px; color:var(--muted); }
.updating .dots{ display:flex; gap:7px; }
.updating .dots i{ width:7px; height:7px; border-radius:50%; background:var(--light); animation:updot 1.1s ease-in-out infinite; }
.updating .dots i:nth-child(2){ animation-delay:.15s; } .updating .dots i:nth-child(3){ animation-delay:.3s; }
@keyframes updot{ 0%,100%{opacity:.25; transform:translateY(0)} 40%{opacity:1; transform:translateY(-4px)} }
.sheet-bg{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:none; }
.sheet-bg.on{ display:block; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--card); color:var(--ink);
  border-radius:22px 22px 0 0; padding:8px 16px var(--pad-bottom); max-height:92vh; display:none; flex-direction:column; }
.sheet.on{ display:flex; }
.grab{ width:38px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 12px; }
.sheet h3{ margin:0 0 14px; font-family:var(--serif); font-size:22px; font-weight:600; }
.req-row{ display:flex; gap:9px; }
.req-row input{ flex:1; min-width:0; font-size:16px; padding:13px; }
.req-row button{ flex:0 0 auto; padding:13px 22px; border-radius:14px; font-size:16px; font-weight:650;
  background:var(--card-2); border:1px solid var(--edge); }
.req-row button:disabled{ opacity:.4; }
.req-note{ font-size:12.5px; line-height:1.45; color:var(--ink-muted); margin:11px 2px 0; }
.mine-list{ margin-top:20px; border-top:1px solid var(--line); padding-top:6px; overflow-y:auto; }
.mine-list .item{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
.mine-list .item p{ flex:1; margin:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.status{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
.status.pending{ background:rgba(235,203,130,.14); color:#D2B676; }
.status.added{ background:rgba(235,203,130,.22); color:var(--light-top); }
.sheet .row{ display:flex; margin-top:14px; }
.sheet .row button{ flex:1; padding:15px; border-radius:15px; font-size:16px; font-weight:600; background:var(--card-2); }

/* ---------- motion: all of it optional ---------- */
@media (prefers-reduced-motion:no-preference){
  @keyframes ff{ 0%,100%{transform:translate(0,0); opacity:calc(var(--o,.7) * .25);} 30%{opacity:var(--o,.7);}
    50%{transform:translate(var(--x,8px),var(--y,-10px)); opacity:calc(var(--o,.7) * .6);} 75%{opacity:var(--o,.7);} }
  .ff{ animation:ff var(--t,7s) ease-in-out var(--d,0s) infinite; }
  @keyframes sway{ 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  .lantern{ animation:sway 4.5s ease-in-out infinite; }
  @keyframes rise{ from{transform:translateY(12px); opacity:0;} to{transform:none; opacity:1;} }
  #home.on .home-hero, #home.on .jar, #home.on .caught{ animation:rise .6s cubic-bezier(.2,.8,.3,1) backwards; }
  #home.on .jar{ animation-delay:.1s; } #home.on .caught{ animation-delay:.18s; }
  #home.leaving .ff{ animation:none; opacity:0; transform:translate(var(--tx,0px),var(--ty,0px)) scale(.5);
    transition:transform .7s cubic-bezier(.5,0,.75,.4), opacity .7s ease-in; }
  #home.leaving .home-hero, #home.leaving .jar svg, #home.leaving .caught, #home.leaving .tap{ opacity:0; transition:opacity .45s ease; }
  @keyframes dealIn{ from{transform:translateY(18px) scale(.965); opacity:0;} to{transform:none; opacity:1;} }
  .card-wrap.enter{ animation:dealIn .3s cubic-bezier(.2,.8,.3,1); }
  @keyframes leaveGot{ to{transform:translateX(40%) rotate(5deg); opacity:0;} }
  @keyframes leaveMiss{ to{transform:translateX(-40%) rotate(-5deg); opacity:0;} }
  @keyframes leaveOn{ to{transform:translateY(-6%) scale(.97); opacity:0;} }
  .card-wrap.leave-got{ animation:leaveGot .2s cubic-bezier(.4,0,1,1) forwards; }
  .card-wrap.leave-miss{ animation:leaveMiss .2s cubic-bezier(.4,0,1,1) forwards; }
  .card-wrap.leave-on{ animation:leaveOn .18s cubic-bezier(.4,0,1,1) forwards; }
  .actions > *{ animation:rise .3s cubic-bezier(.2,.8,.3,1) backwards; }
  .actions > *:nth-child(2){ animation-delay:.05s; }
  .answered .reveal > *{ animation:rise .4s cubic-bezier(.2,.8,.3,1) backwards; }
  .answered .reveal > *:nth-child(2){ animation-delay:.08s; } .answered .reveal > *:nth-child(3){ animation-delay:.14s; }
  .answered .reveal > *:nth-child(4){ animation-delay:.2s; } .answered .reveal > *:nth-child(5){ animation-delay:.26s; }
  #done.on > *{ animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards; }
  .btn-main, .fab, .icon-btn, .ans, .speak-btn{ transition:transform .12s ease; }
  .btn-main:active, .fab:active, .ans:active, .speak-btn:active{ transform:scale(.965); }
  @keyframes shoot{ 0%{transform:translate3d(0,0,0) rotate(24deg); opacity:0;} 12%{opacity:.9;}
    100%{transform:translate3d(190px,84px,0) rotate(24deg); opacity:0;} }
  .sky .shoot{ position:absolute; width:70px; height:1.2px; border-radius:2px;
    background:linear-gradient(90deg, rgba(228,239,230,0), rgba(228,239,230,.9)); animation:shoot .95s ease-out forwards; }
}
@media (prefers-reduced-motion:reduce){ .sky i{ animation:none; opacity:calc(var(--o) * .7); } .word.ignite, .hint span{ animation:none; } }
@media (max-height:700px){ .home-hero{ margin-top:96px; } .jar{ margin-top:20px; } .cue{ font-size:22px; } .word{ font-size:36px; } }
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<section id="home" class="screen on">
  <div class="woods" aria-hidden="true">
    <svg class="trees" id="trees" viewBox="0 0 390 300" preserveAspectRatio="xMidYMax slice"></svg>
    <div class="cone"></div>
    <div id="woodsFlies"></div>
  </div>
  <div class="lantern" aria-hidden="true"><svg viewBox="0 0 40 70"><line x1="20" y1="0" x2="20" y2="12" stroke="#3B4A3F" stroke-width="1.5"/><path d="M12 14h16l-3 6H15z" fill="#2B3A2F"/><rect x="11" y="20" width="18" height="30" rx="3" fill="#F2D892"/><rect x="11" y="20" width="18" height="30" rx="3" fill="none" stroke="#2B3A2F" stroke-width="2"/><line x1="20" y1="20" x2="20" y2="50" stroke="#2B3A2F" stroke-width="1.5"/><path d="M13 50h14l-2 5H15z" fill="#2B3A2F"/></svg></div>
  <div class="home-hero">
    <h1 class="title">Vocab</h1>
    <div class="subtitle">Catch the words by lamplight</div>
  </div>
  <div class="jar" id="jar" aria-hidden="true"><svg viewBox="0 0 110 150"><rect x="30" y="2" width="50" height="12" rx="3" fill="#3A4B3F"/><path d="M28 16h54c10 8 18 20 18 40v70c0 12-8 20-20 20H30c-12 0-20-8-20-20V56c0-20 8-32 18-40z" fill="rgba(200,230,210,.06)" stroke="rgba(220,235,225,.32)" stroke-width="2"/></svg></div>
  <div class="caught" id="caught"></div>
  <div class="tap" id="tap">Tap to start</div>
  <button class="tester-btn" id="testerBtn" aria-pressed="false">Tester</button>
</section>

<section id="study" class="screen">
  <div class="top">
    <button class="icon-btn" id="exit" aria-label="Stop">&#10005;</button>
    <span class="left" id="left"></span>
    <button class="icon-btn" id="undo" aria-label="Undo last answer" disabled>&#8634;</button>
  </div>
  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card"><div class="card-body" id="body"></div></div>
  </div>
  <div class="actions" id="actions"></div>
</section>

<section id="done" class="screen">
  <div class="flies" id="doneFlies" aria-hidden="true"></div>
  <div class="big">All caught up</div>
  <div class="sub" id="doneSub"></div>
  <div class="row"><button class="btn-ghost" id="more">Keep going</button><button class="btn-main" id="doneHome">Back to the woods</button></div>
</section>

<button class="fab" id="fab" aria-label="Request a word">+</button>
<button class="update-pill" id="updatePill" hidden><i></i>Update ready</button>
<div class="updating" id="updating" hidden><div class="dots"><i></i><i></i><i></i></div><p>Updating</p><span>This only takes a moment</span></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>Request a word</h3>
  <div class="req-row">
    <input id="reqInput" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" placeholder="Word or phrase">
    <button id="reqSend" disabled>Send</button>
  </div>
  <p class="req-note">Sent straight to Elijah. It turns green once the word is in the deck.</p>
  <div class="mine-list" id="mineList"></div>
  <div class="row"><button id="closeSheet">Done</button></div>
</div>

<script src="words.js"></script>
<script src="contexts.js"></script>
<script src="app/content.js"></script>
<script src="app/engine.js"></script>
<script>
'use strict';
const E = window.VocabEngine;
/* Progress. This app keeps its own record under KEY. The previous app's record
   (OLD_KEY) is read once, to place the words already met, and is NEVER written
   or deleted: it stays exactly as it was, as the way back. */
const KEY = 'vocab.v3';
const OLD_KEY = 'vocab.main.v2';
const $ = id => document.getElementById(id);
const CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const POS = {adj:'adjective', adv:'adverb', v:'verb', n:'noun', prep:'preposition', conj:'conjunction', phrase:'phrase', idiom:'idiom'};
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const marked = s => esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>');
const struck = s => esc(s).replace(/\[([^\]]+)\]/g, '<s>$1</s>');
const gapped = s => esc(s).replace(/([A-Za-z]?)(_{2,})/g, (m, l) => `<span class="gap">${l || '&nbsp;'}</span>`);
const sizeClass = w => w.length > 24 ? ' longer' : w.length > 14 ? ' long' : '';

/* ---------- deck ---------- */
const C = window.CONTENT || {words:{}, global:{}};
const DECK = (window.WORDS || []).map(w => Object.assign({
  word: w.word, pos: w.part_of_speech, pos_full: POS[String(w.part_of_speech).toLowerCase()] || w.part_of_speech,
  def: w.definition, ru: w.russian_synonyms, en: w.english_synonyms, ex: w.example,
  contexts: (window.CONTEXTS && window.CONTEXTS[w.word]) || [w.example],
  themes: (C.global.word_themes || {})[w.word] || []
}, C.words[w.word] || {}));

/* ---------- storage ---------- */
let S;
function load(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  S = E.repair(raw, Date.now());
  if(!Array.isArray(S.requests)) S.requests = [];
  if(!S.importedAt){
    let old = null;
    try{ old = JSON.parse(localStorage.getItem(OLD_KEY)); }catch(e){}
    if(old){
      E.importOld(S, old, DECK.map(d => d.word), Date.now());
      // word requests made in the old app come along too (copied, not moved)
      (Array.isArray(old.requests) ? old.requests : []).forEach(r => {
        if(r && r.text && !S.requests.some(x => x.text.toLowerCase() === String(r.text).toLowerCase()))
          S.requests.push({text: String(r.text), ts: r.ts, sent: !!r.sent});
      });
    } else S.importedAt = Date.now();
  }
  save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- sound and clips ---------- */
const audio = new Audio(); audio.preload = 'auto';
function say(text){
  audio.src = 'audio/' + slug(text) + '.mp3';
  audio.onerror = () => { try{ const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; speechSynthesis.speak(u); }catch(e){} };
  const p = audio.play(); if(p && p.catch) p.catch(() => {});
}
let GIFS = {};
fetch('gifs.json').then(r => r.ok ? r.json() : {}).then(j => { GIFS = j || {}; }).catch(() => {});
/* GIPHY's free licence asks for the credit wherever a clip appears */
const clip = word => GIFS[word] ? `<div class="clip"><img alt="" src="${esc(GIFS[word])}"><span class="credit">Powered By GIPHY</span></div>` : '';
const speakerIcon = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';

/* ---------- fireflies, sky, trees ---------- */
function firefly(x, y, o, small){
  const f = document.createElement('i');
  f.className = 'ff' + (small ? ' small' : '');
  const d = small ? 5 : 10;
  f.style.cssText = `left:${x}%;top:${y}%;--o:${o};--t:${(5 + Math.random() * 5).toFixed(1)}s;` +
    `--d:${(-Math.random() * 9).toFixed(1)}s;--x:${((Math.random() - .5) * 2 * d).toFixed(0)}px;--y:${((Math.random() - .5) * 2 * d).toFixed(0)}px`;
  return f;
}
(function buildSky(){
  const sky = $('sky'); let seed = 20260930;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for(let n = 0; n < 48; n++){
    const i = document.createElement('i'), size = (rnd() * 1.3 + 1).toFixed(2);
    i.style.cssText = `left:${(rnd() * 100).toFixed(2)}%;top:${(rnd() * 100).toFixed(2)}%;width:${size}px;height:${size}px;` +
      `--o:${(rnd() * .38 + .22).toFixed(2)};--t:${(rnd() * 4.2 + 2.8).toFixed(2)}s;--d:${(rnd() * -7).toFixed(2)}s`;
    sky.appendChild(i);
  }
  if(CALM) return;
  const shoot = () => {
    if(!document.hidden){
      const s = document.createElement('i'); s.className = 'shoot';
      s.style.left = (8 + Math.random() * 44) + '%'; s.style.top = (4 + Math.random() * 30) + '%';
      sky.appendChild(s); setTimeout(() => s.remove(), 1100);
    }
    setTimeout(shoot, 16000 + Math.random() * 26000);
  };
  setTimeout(shoot, 7000 + Math.random() * 9000);
})();
(function drawTrees(){
  const svg = $('trees'); let seed = 7; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pine = (x, base, h, w) => {
    let d = `M${(x - w * .06).toFixed(1)} ${base}h${(w * .12).toFixed(1)}v${(-h * .12).toFixed(1)}h${(-w * .12).toFixed(1)}z`;
    for(let k = 0; k < 4; k++){
      const top = base - h + k * h * .2, bot = top + h * .38, half = w * (.22 + k * .1);
      d += `M${x.toFixed(1)} ${top.toFixed(1)}L${(x + half).toFixed(1)} ${bot.toFixed(1)}L${(x - half).toFixed(1)} ${bot.toFixed(1)}z`;
    }
    return d;
  };
  const rank = (fill, base, hMin, hVar, gap) => {
    let d = '', x = -10;
    while(x < 400){ const h = hMin + r() * hVar; d += pine(x, base + r() * 8, h, h * (.55 + r() * .15)); x += gap * (.7 + r() * .6); }
    return `<path d="${d}" fill="${fill}"/><rect x="0" y="${base}" width="390" height="${300 - base}" fill="${fill}"/>`;
  };
  svg.innerHTML = rank('#14251A', 200, 60, 50, 34) + rank('#0F1E15', 250, 80, 60, 40) + rank('#0A150E', 296, 100, 70, 46);
})();

/* ---------- screens ---------- */
function show(name){
  ['home','study','done'].forEach(s => $(s).classList.toggle('on', s === name));
  $('fab').style.display = name === 'study' ? 'none' : 'grid';
  if(name === 'home') refreshHome();
}
/* Every word you have caught (it comes to you from its meaning) is a firefly
   in the jar, brighter the better you know it. The rest are still in the woods. */
function refreshHome(){
  S = E.repair(S, Date.now());
  const sm = new E.Session(S, DECK, C.global, {}).summary();
  const caught = sm.byStage.slice(2).reduce((a, b) => a + b, 0), learning = sm.byStage[1];
  const woods = DECK.length - caught - learning;
  $('caught').innerHTML = `<b>${caught}</b> caught · ${learning ? `<b>${learning}</b> being learned · ` : ''}${woods} still in the woods` +
    (sm.due ? `<br><b>${sm.due}</b> to practise today` : '') +
    (sm.placement ? `<br><b>${sm.placement}</b> from before, to check` : '');
  const jar = $('jar'); jar.querySelectorAll('.ff').forEach(f => f.remove());
  const lit = [];
  DECK.forEach(e => { const w = S.words[e.word]; if(w && w.stage >= 2) lit.push(w.stage); });
  lit.sort((a, b) => b - a).slice(0, 40).forEach(st => jar.appendChild(firefly(18 + Math.random() * 62, 40 + Math.random() * 48, .45 + st * .1)));
  const wf = $('woodsFlies'); wf.textContent = '';
  for(let i = 0; i < Math.min(woods + learning, 14); i++) wf.appendChild(firefly(4 + Math.random() * 92, 52 + Math.random() * 40, .7));
  $('tap').textContent = 'Tap to start';
}

/* ---------- the session ---------- */
let sess = null, card = null, shownAt = 0, hintsUsed = 0, undoStack = [], leaving = false;

function startSession(extra){
  S = E.repair(S, Date.now());
  sess = new E.Session(S, DECK, C.global, {extra});
  undoStack = []; $('undo').disabled = true;
  next(true);
}
function startFromHome(){
  if(leaving) return;
  startSession(false);
  if(!card){ return; }
  if(CALM){ show('study'); return; }
  const home = $('home'), lan = document.querySelector('.lantern').getBoundingClientRect();
  const lx = lan.left + lan.width / 2, ly = lan.top + lan.height * .5;
  home.querySelectorAll('.ff').forEach(f => {
    const b = f.getBoundingClientRect();
    f.style.setProperty('--tx', (lx - b.left) + 'px'); f.style.setProperty('--ty', (ly - b.top) + 'px');
  });
  leaving = true; $('fab').style.display = 'none';
  home.classList.add('leaving');
  setTimeout(() => { show('study'); home.classList.remove('leaving'); deal(); leaving = false; }, 720);
}
$('home').addEventListener('click', e => { if(!e.target.closest('#fab')) startFromHome(); });

function next(first){
  Rec.cancel();
  save();
  card = sess.next();
  hintsUsed = 0;
  if(!card) return finished();
  const left = sess.queue.length + 1;
  $('left').textContent = `${left} to go`;
  render();
  if(!first) deal();
  else if($('study').classList.contains('on')) deal();
}
function deal(){
  const w = $('cardWrap'); w.classList.remove('leave-got', 'leave-miss', 'leave-on', 'enter');
  void w.offsetWidth; w.classList.add('enter');
}
/* the card leaves the way you judged it, then the next is dealt */
function answer(res, how){
  stopHints();
  snapshot();
  sess.answer(res);
  if(CALM){ next(); return; }
  const w = $('cardWrap'); w.classList.remove('enter');
  w.classList.add(how === 'got' ? 'leave-got' : how === 'miss' ? 'leave-miss' : 'leave-on');
  setTimeout(() => next(), 190);
}
function snapshot(){
  undoStack.push({S: JSON.stringify(S), queue: JSON.stringify(sess.queue), learn: JSON.stringify(sess.learn),
    done: sess.done, item: sess.current && sess.current.item, tail: sess.tailAdded, asked: sess.asked});
  if(undoStack.length > 20) undoStack.shift();
  $('undo').disabled = false;
}
$('undo').addEventListener('click', () => {
  const u = undoStack.pop(); if(!u) return;
  S = JSON.parse(u.S); sess.S = S;
  sess.queue = JSON.parse(u.queue); sess.learn = JSON.parse(u.learn); sess.done = u.done; sess.tailAdded = u.tail; sess.asked = u.asked;
  if(u.item) sess.queue.unshift(u.item);
  $('undo').disabled = !undoStack.length;
  next();
});
$('exit').addEventListener('click', () => { stopHints(); Rec.cancel(); save(); show('home'); });

function finished(){
  save();
  const sm = sess.summary();
  $('doneSub').innerHTML = (sm.tomorrow ? `${sm.tomorrow} word${sm.tomorrow === 1 ? '' : 's'} come back tomorrow.` : 'Come back tomorrow.') +
    '<br>Sleep is part of it: new words settle overnight.';
  const f = $('doneFlies'); f.textContent = '';
  for(let i = 0; i < 9; i++) f.appendChild(firefly(8 + Math.random() * 84, 10 + Math.random() * 80, .55));
  show('done');
}
$('doneHome').addEventListener('click', () => show('home'));
$('more').addEventListener('click', () => { startSession(true); if(card) show('study'); });

/* ---------- rendering ---------- */
const body = () => $('body');
function setActions(html){ $('actions').innerHTML = html; }
function setCard(html, lit){ $('card').classList.toggle('lit', !!lit); body().className = 'card-body'; body().innerHTML = html; body().scrollTop = 0; }

function render(){
  const k = card.kind;
  if(k === 'intro') return renderIntro();
  if(k === 'recall') return card.typed ? renderTyped() : renderSay();
  if(k === 'hook') return renderHook();
  if(k === 'personal-ask') return renderPersonalAsk();
  if(k === 'checkin') return renderCheckin();
  if(k === 'speak') return renderSpeak();
  if(k === 'carry') return renderCarry();
}

function cueHTML(){
  const t = card.type;
  let out;
  if(t === 'upgrade') out = `<div class="cue">${struck(card.cue)}</div>`;
  else if(t === 'contrast') out = `<div class="cue">${gapped(card.cue)}</div><div class="options">One of: ${card.options.map(o => `<b>${esc(o)}</b>`).join(' · ')}</div>`;
  else if(t === 'cloze' || t === 'colloc' || /_{2,}/.test(card.cue || '')) out = `<div class="cue">${gapped(card.cue)}</div>`;
  else if(t === 'ru') out = `<div class="cue ru">${esc(card.cue)}</div>`;
  else out = `<div class="cue">${esc(card.cue)}</div>`;
  if(t === 'personal') out += `<div class="mine">You said: ${esc(card.mine)}</div>`;
  return out;
}
function wordHTML(word){ return `<div class="word-wrap"><div class="word ignite${sizeClass(word)}" id="lit">${esc(word)}</div></div>`; }
function addWordFlies(){
  const w = $('lit'); if(!w || CALM) return;
  [[-6, 10], [104, 22], [96, 96], [-4, 88]].forEach(([x, y]) => w.parentNode.appendChild(firefly(x, y, .55)));
}
function answerParts(){
  const e = card.entry;
  let sent = '';
  if(card.answerSentence){
    sent = card.answerSentence.includes('*') ? marked(card.answerSentence)
      : esc(card.answerSentence).replace(new RegExp(esc(e.word), 'i'), m => `<b>${m}</b>`);
  }
  const top = `<div class="reveal" style="display:flex;flex-direction:column;gap:12px">${wordHTML(e.word)}` +
    (card.stage <= 1 && e.ru ? `<div class="ru-line">${esc(e.ru)}</div>` : '') + `</div>`;
  const more = (sent ? `<div class="sent">${sent}</div>` : '') +
    (card.stage > 1 && e.ru ? `<div class="ru-line">${esc(e.ru)}</div>` : '') +
    (e.nuance ? `<div class="note">${marked(e.nuance)}</div>` : '') + clip(e.word);
  return {top, more};
}

function blanksHTML(word){

    .map(w => `<span class="blank" style="--w:calc(${Math.max(w.length, 2)} * .5em + 10px)"></span>`).join('')}</div>`;

/* Fill the lines with what was heard: the last words said, one per line. */
function fillBlanks(words, cls){
  const slots = [...document.querySelectorAll('#blanks .blank')]; if(!slots.length) return;
  const ws = words.slice(-slots.length);
  slots.forEach((s, i) => {
    const t = ws[i] || '';
    if(s.textContent !== t){ s.textContent = t; s.classList.remove('filled'); void s.offsetWidth; if(t) s.classList.add('filled'); }
    s.classList.toggle('ok', cls === 'ok'); s.classList.toggle('miss', cls === 'miss');

const LIVE = 'wss://voice-transcriber.elijahrobineau.workers.dev/live?app=vocab';
const micIcon = '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
let micOff = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext || window.webkitAudioContext) && window.WebSocket);

const Rec = (() => {
  let ctx = null, stop = null;
  /* Streams the mic as 16 kHz 16-bit PCM. onWords(finalText, interimText, ended) on every result
     (ended = the speaker paused); onEnd(why) once: 'cancel' | 'idle' | 'time' | 'error'. */
  async function live({onWords, onEnd}){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') await ctx.resume();
    const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    const ws = new WebSocket(LIVE); ws.binaryType = 'arraybuffer';
    const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(2048, 1, 1);
    const step = ctx.sampleRate / 16000;
    let done = false, finals = '', lastWords = performance.now(), pending = [];
    const finish = why => {
      if(done) return; done = true; stop = null;
      clearInterval(watch);
      try{ proc.disconnect(); src.disconnect(); }catch(e){}
      stream.getTracks().forEach(t => t.stop());
      try{ if(ws.readyState === 1) ws.send('stop'); ws.close(); }catch(e){}
      onEnd && onEnd(why);
    };
    stop = () => finish('cancel');
    const watch = setInterval(() => { if(performance.now() - lastWords > 20000) finish('idle'); }, 1000);
    proc.onaudioprocess = ev => {
      if(done) return;
      const d = ev.inputBuffer.getChannelData(0), n = Math.floor(d.length / step), out = new Int16Array(n);
      for(let i = 0; i < n; i++){
        let s = 0; const a = Math.floor(i * step), b = Math.max(a + 1, Math.floor((i + 1) * step));
        for(let j = a; j < b; j++) s += d[j];
        const x = Math.max(-1, Math.min(1, s / (b - a)));
        out[i] = x < 0 ? x * 0x8000 : x * 0x7FFF;
      }
      if(ws.readyState === 1){ pending.forEach(p => ws.send(p)); pending = []; ws.send(out.buffer); }
      else if(ws.readyState === 0){ pending.push(out.buffer); if(pending.length > 80) pending.shift(); } // while it connects
    };
    ws.onmessage = e => {
      let j; try{ j = JSON.parse(e.data); }catch(err){ return; }
      if(j.type !== 'Results' || done) return;
      const t = ((((j.channel || {}).alternatives) || [])[0] || {}).transcript || '';
      if(t) lastWords = performance.now();
      if(j.is_final){
        if(t) finals = (finals + ' ' + t).trim();
        onWords(finals, '', !!j.speech_final);
        if(j.speech_final) finals = '';
      } else onWords(finals, t, false);
    };
    ws.onclose = ev => finish(ev.reason === 'time' ? 'time' : 'error');
    src.connect(proc); proc.connect(ctx.destination);
  }
  return {live, cancel: () => stop && stop()};
})();

/* "it was arduous" still counts: try the whole answer, then every run of its words */
function heardVerdict(entry, text){
  let best = E.checkTyped(entry, text);
  const ws = text.split(/\s+/).filter(Boolean);
  for(let n = 1; n <= ws.length && best !== 'right'; n++)
    for(let i = 0; i + n <= ws.length; i++){
      const r = E.checkTyped(entry, ws.slice(i, i + n).join(' '));
      if(r === 'right'){ best = r; break; }
      if(r === 'close') best = 'close';
    }
  return best;
}
/* Live words on one line: when a phrase runs past the edge, the oldest words drop off the front. */
function fitWords(el, text){
  if(!el) return;
  const ws = text.split(/\s+/).filter(Boolean);
  el.textContent = ws.join(' ');
  while(ws.length > 1 && el.scrollWidth > el.clientWidth){ ws.shift(); el.textContent = '… ' + ws.join(' '); }
}

  });
}
const inflight = new Set();
function flushQueue(){
  S.requests.filter(r => !r.sent && !inflight.has(r.text)).forEach(r => {
    inflight.add(r.text);
    fetch(REQUEST_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({word: r.text, at: r.ts})})
      .then(res => { if(res.ok){ r.sent = true; save(); renderRequests(); } }).catch(() => {}).then(() => inflight.delete(r.text));
  });
}

/* ---- offline shell, and updating itself ----
   Carried over unchanged from the previous app, where it was proven on his
   phone: NEVER reload a page the user can see mid-use. An update is applied
   when the app comes back to the foreground and nothing has been touched yet,
   which looks exactly like the app starting; the pill appears after four
   minutes if the app is never backgrounded. Every answer is saved as it is
   given, so a reload can never cost a review. */
if('serviceWorker' in navigator){
  const PILL_AFTER = 4 * 60 * 1000;
  let waiting = null, updateReady = false, applying = false, pillTimer = null, navigated = false;
  let resumedAt = Date.now(), touchedSinceResume = false;
  const safeMoment = () => !document.hidden && !touchedSinceResume && (Date.now() - resumedAt) < 15000;
  function applyUpdate(){
    if(applying || document.hidden) return;
    applying = true; clearTimeout(pillTimer);
    $('updatePill').hidden = true; $('updating').hidden = false;
    const go = () => { if(navigated) return; navigated = true; location.reload(); };
    navigator.serviceWorker.addEventListener('controllerchange', go, {once: true});
    if(waiting){ try{ waiting.postMessage({type: 'SKIP_WAITING'}); }catch(e){} }
    setTimeout(go, 2000);
    setTimeout(() => {
      if(navigated && document.visibilityState !== 'visible') return;
      applying = false; $('updating').hidden = true;
      if(updateReady) $('updatePill').hidden = false;
    }, 7000);
  }
  function markUpdateReady(worker){
    if(worker) waiting = worker;
    if(updateReady) return;
    updateReady = true;
    if(safeMoment()){ applyUpdate(); return; }
    pillTimer = setTimeout(() => { if(updateReady && !applying) $('updatePill').hidden = false; }, PILL_AFTER);
  }
  window.markUpdateReady = markUpdateReady;
  const tapPill = e => { if(e) e.preventDefault(); applying = false; applyUpdate(); };
  $('updatePill').addEventListener('pointerdown', tapPill);
  $('updatePill').addEventListener('click', tapPill);
  document.addEventListener('pointerdown', e => {
    if(e.target.closest && e.target.closest('#updatePill')) return;
    touchedSinceResume = true;
  }, true);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) return;
    resumedAt = Date.now(); touchedSinceResume = false;
    if(updateReady) applyUpdate();

        const nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', () => { if(nw.state === 'installed' && navigator.serviceWorker.controller) markUpdateReady(nw); });
      });
      const check = () => { try{ reg.update(); }catch(e){} };
      document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
      window.addEventListener('focus', check);
      setInterval(check, 30 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
</body>
</html>
