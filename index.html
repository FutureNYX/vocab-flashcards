<!doctype html>
<html lang="en" data-palette="fern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="theme-color" content="#0A100C">
<meta name="color-scheme" content="dark">
<title>Vocab</title>
<style>
/* Palettes. Switch by changing data-palette on <html>: moss | clay | fern */
:root, [data-palette="moss"]{        /* deep green, sage accent */
  --bg:#0E1311;  --card:#161D19;  --card-2:#1F2823;
  --text:#ECF1ED; --muted:#8B978F; --line:#29332D; --ru-text:#C6D2C8;
  --accent:#86B26A; --on-accent:#0E1311;
  --wrong:#E07A5F; --hard:#E0A458; --easy:#86B26A;
  --hl-bg:rgba(134,178,106,.22); --hl-text:#AFD298;
  --hard-soft:rgba(224,164,88,.17); --easy-soft:rgba(134,178,106,.17);
}
[data-palette="clay"]{               /* warm earth, olive accent */
  --bg:#14110E;  --card:#1E1A16;  --card-2:#282320;
  --text:#F3EDE5; --muted:#9C9086; --line:#342D27; --ru-text:#DED6CA;
  --accent:#A8B98C; --on-accent:#14110E;
  --wrong:#CF7B62; --hard:#DBA75E; --easy:#A8B98C;
  --hl-bg:rgba(168,185,140,.24); --hl-text:#C7D5AD;
  --hard-soft:rgba(219,167,94,.17); --easy-soft:rgba(168,185,140,.17);
}
[data-palette="fern"]{               /* cool near-black green, mint accent */
  --bg:#0A100C;  --card:#121A15;  --card-2:#1A241D;
  --text:#E9F1EA; --muted:#7E8C83; --line:#22302A; --ru-text:#C3D2C7;
  --accent:#6FC192; --on-accent:#08120C;
  --wrong:#D97B7B; --hard:#D3AA63; --easy:#6FC192;
  --hl-bg:rgba(111,193,146,.20); --hl-text:#95D6B1;
  --hard-soft:rgba(211,170,99,.17); --easy-soft:rgba(111,193,146,.17);
}
:root{
  --pad-bottom: max(14px, env(safe-area-inset-bottom));
  --pad-top: max(10px, env(safe-area-inset-top));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
.screen{position:fixed; inset:0; display:none; flex-direction:column;
  padding:var(--pad-top) 14px var(--pad-bottom);}
.screen.on{display:flex;}

/* ---------- HOME ---------- */
#home{justify-content:center; align-items:center; text-align:center; gap:6px;}
#home h1{font-size:34px; font-weight:800; letter-spacing:-.02em; margin:0;}
#home .sub{color:var(--muted); font-size:15px; margin-bottom:26px;}
.stats{display:flex; gap:10px; width:100%; max-width:420px; margin-bottom:26px;}
.stat{flex:1; background:var(--card); border-radius:16px; padding:14px 8px;}
.stat b{display:block; font-size:24px; font-weight:700; letter-spacing:-.02em;}
.stat span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em;}
.btn-main{width:100%; max-width:420px; background:var(--accent); color:var(--on-accent); font-weight:700;
  font-size:17px; padding:16px; border-radius:16px;}
.btn-ghost{width:100%; max-width:420px; background:var(--card); color:var(--text);
  font-size:15px; padding:14px; border-radius:16px; margin-top:10px;}

/* ---------- STUDY ---------- */
#study{padding-left:12px; padding-right:12px;}
.top{display:flex; align-items:center; justify-content:space-between; height:38px; flex:0 0 auto;}
.top .counts{display:flex; gap:14px; font-size:12px; color:var(--muted);
  font-variant-numeric:tabular-nums;}
.top .counts em{font-style:normal; color:var(--text); font-weight:650;}
.icon-btn{width:38px; height:38px; display:grid; place-items:center; color:var(--muted); font-size:19px;}
.icon-btn:disabled{opacity:.25;}

.card-wrap{flex:1 1 auto; position:relative; perspective:1400px; margin:8px 0 12px; min-height:0;}
.card{position:absolute; inset:0; transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.22,.68,.28,1);}
.card.flipped{transform:rotateY(180deg);}
/* a new card should snap to its front, not reverse-flip and flash its answer */
.card.noanim, .card.noanim .face{transition:none !important;}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border-radius:24px; display:flex; flex-direction:column; overflow:hidden;
  /* An identity transform gives each face its own 3D context, so the speaker
     button is flattened onto the face instead of floating on its own plane
     mid-turn. Without this the button visibly detaches while the card flips. */
  transform:rotateY(0deg);}
.face.back{transform:rotateY(180deg);}

.speaker{position:absolute; top:14px; right:14px; width:56px; height:56px; border-radius:50%;
  background:var(--card-2); display:grid; place-items:center;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;}
.speaker svg{width:26px; height:26px; fill:var(--text);}
.speaker:active{background:var(--line);}

.front-body{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:74px 22px 26px; text-align:center; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.front-word{font-size:40px; font-weight:750; letter-spacing:-.025em; line-height:1.1; word-break:break-word;}
.front-word.long{font-size:28px;}
.pos{margin-top:12px; color:var(--muted); font-size:13px; letter-spacing:.06em; text-transform:uppercase;}
.example{margin-top:26px; padding-top:22px; border-top:1px solid var(--line); max-width:330px;
  font-size:16px; line-height:1.55; color:#A9A9B2;}
.example .hl{background:var(--hl-bg); color:var(--hl-text); font-weight:650;
  padding:1px 5px; border-radius:6px;}
.example:empty{display:none;}

.back-head{display:flex; align-items:center; gap:12px; padding:18px 18px 14px 22px;
  border-bottom:1px solid var(--line); flex:0 0 auto;}
.back-word{font-size:23px; font-weight:700; letter-spacing:-.02em; flex:1; word-break:break-word;}
.spk-sm{width:44px; height:44px; border-radius:50%; background:var(--card-2); display:grid;
  place-items:center; flex:0 0 auto;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;}
.spk-sm svg{width:21px; height:21px; fill:var(--text);}
.spk-sm:active{background:var(--line);}
.back-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.sect{padding:16px 22px; border-bottom:1px solid var(--line);}
.sect:last-child{border-bottom:none;}
.sect h4{margin:0 0 7px; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); font-weight:650;}
.sect h4.sub{margin-top:17px;}
.sect p{margin:0; font-size:16.5px; line-height:1.45;}
.sect.ru p{color:var(--ru-text);}
.chips{display:flex; flex-wrap:wrap; gap:7px;}
.chip{background:var(--hl-bg); color:var(--hl-text); font-weight:600; font-size:15px;
  padding:5px 11px; border-radius:9px; line-height:1.3;}

.hint{flex:0 0 auto; text-align:center; color:var(--muted); font-size:13px; padding:20px 0 22px;}
.answers{flex:0 0 auto; display:none; gap:8px;}
.answers.on{display:flex;}
.ans{flex:1; border-radius:16px; padding:12px 4px 10px; background:var(--card);
  display:flex; flex-direction:column; align-items:center; gap:2px;}
.ans b{font-size:15.5px; font-weight:650;}
.ans span{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
.ans:active{filter:brightness(1.35);}
.ans.w b{color:var(--wrong);} .ans.h b{color:var(--hard);} .ans.e b{color:var(--easy);}

/* ---------- DONE ---------- */
#done{justify-content:center; align-items:center; text-align:center; gap:8px;}
#done .big{font-size:26px; font-weight:750; letter-spacing:-.02em;}
#done .sub{color:var(--muted); font-size:15px; margin-bottom:24px;}

/* ---------- FAB + SHEET ---------- */
.fab{position:fixed; right:18px; bottom:calc(var(--pad-bottom) + 14px);
  width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--on-accent);
  font-size:31px; font-weight:300; line-height:1; display:grid; place-items:center;
  box-shadow:0 8px 26px rgba(0,0,0,.55); z-index:40;}
.fab:active{transform:scale(.94);}
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:none;}
.sheet-bg.on{display:block;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--bg);
  border-radius:22px 22px 0 0; padding:8px 16px var(--pad-bottom); max-height:92vh;
  display:none; flex-direction:column; transform:translateY(0);}
.sheet.on{display:flex;}
.grab{width:38px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 12px;}
.sheet h3{margin:0 0 14px; font-size:19px; font-weight:700; letter-spacing:-.01em;}
.req-row{display:flex; gap:9px;}
.req-row input{flex:1; min-width:0; background:var(--card); border:1px solid var(--line);
  border-radius:14px; color:var(--text); padding:13px; font-size:16px; font-family:inherit;}
.req-row input:focus{outline:none; border-color:var(--accent);}
.req-row button{flex:0 0 auto; padding:13px 22px; border-radius:14px; font-size:16px; font-weight:650;}
.req-note{font-size:12.5px; line-height:1.45; color:var(--muted); margin:11px 2px 0;}
.status{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; flex:0 0 auto;
  letter-spacing:.02em;}
.status.pending{background:var(--hard-soft); color:var(--hard);}
.status.added{background:var(--easy-soft); color:var(--easy);}
.sheet .row{display:flex; gap:10px; margin-top:14px;}
.sheet .row button{flex:1; padding:15px; border-radius:15px; font-size:16px; font-weight:600;}
.cancel{background:var(--card);}
.save{background:var(--accent); color:var(--on-accent);}
.save:disabled{opacity:.4;}
.mine{margin-top:20px; border-top:1px solid var(--line); padding-top:14px; overflow-y:auto;}
.mine .item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.mine .item p{flex:1; margin:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mine .item button{color:var(--wrong); font-size:14px; padding:6px 8px;}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen on">
  <h1>Vocab</h1>
  <div class="sub" id="homeSub">IELTS high-band words</div>
  <div class="stats">
    <div class="stat"><b id="sDue">0</b><span>Due</span></div>
    <div class="stat"><b id="sNew">0</b><span>New</span></div>
    <div class="stat"><b id="sKnown">0</b><span>Learned</span></div>
  </div>
  <button class="btn-main" id="goStudy">Start</button>
</section>

<!-- ============ STUDY ============ -->
<section id="study" class="screen">
  <div class="top">
    <button class="icon-btn" id="back">&#10005;</button>
    <div class="counts">
      <span>Due <em id="cDue">0</em></span>
      <span>New <em id="cNew">0</em></span>
    </div>
    <button class="icon-btn" id="undo" disabled>&#8634;</button>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <div class="face front">
        <button class="speaker" data-speak><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.6 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg></button>
        <div class="front-body">
          <div class="front-word" id="fWord"></div>
          <div class="pos" id="fPos"></div>
          <div class="example" id="fEx"></div>
        </div>
      </div>
      <div class="face back">
        <div class="back-head">
          <div class="back-word" id="bWord"></div>
          <button class="spk-sm" data-speak><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.6 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg></button>
        </div>
        <div class="back-body" id="bBody"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">Tap the card to reveal</div>
  <div class="answers" id="answers">
    <button class="ans w" data-r="wrong"><b>Wrong</b><span id="tW">1m</span></button>
    <button class="ans h" data-r="hard"><b>Hard</b><span id="tH">5m</span></button>
    <button class="ans e" data-r="easy"><b>Easy</b><span id="tE">10m</span></button>
  </div>
</section>

<!-- ============ DONE ============ -->
<section id="done" class="screen">
  <div class="big">All caught up</div>
  <div class="sub" id="doneSub"></div>
  <button class="btn-main" id="doneHome">Back to start</button>
</section>

<button class="fab" id="fab">+</button>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>Request a word</h3>
  <div class="req-row">
    <input id="reqInput" type="text" inputmode="text" autocomplete="off" autocapitalize="none"
           autocorrect="off" placeholder="Word or phrase">
    <button class="save" id="reqSend" disabled>Send</button>
  </div>
  <p class="req-note">Sent straight to Elijah. It turns green once the word is in the deck.</p>
  <div class="mine" id="mine"></div>
  <div class="row"><button class="cancel" id="closeSheet">Done</button></div>
</div>

<script src="words.js"></script>
<script>
/* ============================================================
   STORAGE  —  progress lives in this browser, on this device
   ============================================================ */
const KEY = 'vocab.main.v2';
let S = null;

function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ S = null; }
  if(!S || typeof S !== 'object') S = {cards:{}, requests:[]};
  S.cards    = S.cards    || {};
  S.requests = S.requests || [];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function deck(){
  return (window.WORDS||[]).map(w => ({
    id: w.word,
    word: w.word, pos: w.part_of_speech, ex: w.example,
    def: w.definition, rudef: w.russian_definition,
    en: w.english_synonyms, ru: w.russian_synonyms
  }));
}

/* ============================================================
   SPACED REPETITION
   Deliberately short-term: a word you keep getting right tops
   out at 10 days rather than vanishing for a month.
   ============================================================ */
const MIN = 60000, DAY = 1440;              // DAY measured in minutes
const LEARN = [1, 10];                       // minutes
const GRADUATE = DAY;                        // first real interval: 1 day
const EASY_FIRST = 2 * DAY;                  // knew it cold on sight
const MAX_IVL = 10 * DAY;                    // ceiling: 10 days
const EASE0 = 2.2, EASE_MIN = 1.3, EASE_MAX = 2.8;

function fresh(id){ return {id, stage:'new', step:0, ivl:0, ease:EASE0, due:0, reps:0, lapses:0}; }
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* Pure: returns the next state of a card for a given answer. */
function apply(c, r, now){
  const n = Object.assign({}, c);
  n.reps++;
  if(n.stage === 'new' || n.stage === 'learning'){
    n.stage = 'learning';
    if(r === 'wrong'){ n.step = 0; n.due = now + LEARN[0]*MIN; }
    else if(r === 'hard'){
      // Hard still moves you forward, just in smaller hops than Easy —
      // otherwise a word you always find hard would loop in the learning
      // steps forever and never earn a day-scale interval.
      n.step++;
      if(n.step >= LEARN.length){ n.stage='review'; n.ivl = GRADUATE; n.due = now + n.ivl*MIN; }
      else { n.due = now + LEARN[n.step]*MIN; }
    }
    else { n.stage='review'; n.ivl = EASY_FIRST; n.due = now + n.ivl*MIN; }
  }
  else if(n.stage === 'relearn'){
    if(r === 'wrong'){ n.due = now + 5*MIN; }
    else if(r === 'hard'){ n.due = now + 10*MIN; }
    else { n.stage='review'; n.due = now + n.ivl*MIN; }
  }
  else { /* review */
    if(r === 'wrong'){
      n.lapses++; n.ease = clamp(n.ease-0.2, EASE_MIN, EASE_MAX);
      n.ivl = clamp(Math.round(n.ivl*0.4), DAY, MAX_IVL);
      n.stage = 'relearn'; n.step = 0; n.due = now + 5*MIN;
    } else if(r === 'hard'){
      n.ease = clamp(n.ease-0.15, EASE_MIN, EASE_MAX);
      // cap last, so a card sitting at the ceiling stays there
      n.ivl = Math.min(MAX_IVL, Math.max(Math.round(n.ivl*1.3), n.ivl+720));
      n.due = now + n.ivl*MIN;
    } else {
      n.ivl = Math.min(MAX_IVL, Math.max(Math.round(n.ivl*n.ease), n.ivl+DAY));
      n.ease = clamp(n.ease+0.1, EASE_MIN, EASE_MAX);
      n.due = now + n.ivl*MIN;
    }
  }
  return n;
}

/* How long until this card comes back, in words. */
function gap(c, r, now){
  const n = apply(c, r, now);
  return human(Math.round((n.due - now)/MIN));
}
function human(m){
  if(m < 60) return Math.max(1,Math.round(m)) + 'm';
  if(m < DAY) return Math.round(m/60) + 'h';
  const d = m/DAY;
  return (d < 10 ? +d.toFixed(d % 1 && d < 3 ? 1 : 0) : Math.round(d)) + 'd';
}

/* ============================================================
   QUEUE
   ============================================================ */
function stateOf(id){ return S.cards[id] || null; }
function counts(){
  const now = Date.now(), all = deck();
  let due = 0, neu = 0, known = 0;
  all.forEach(w => {
    const c = stateOf(w.id);
    if(!c){ neu++; return; }
    if(c.due <= now) due++;
    if(c.stage === 'review') known++;
  });
  return {due, neu, known, total: all.length};
}
function pickNext(){
  const now = Date.now(), all = deck();
  const seen = all.filter(w => stateOf(w.id)).map(w => ({w, c: stateOf(w.id)}));
  const ready = seen.filter(x => x.c.due <= now).sort((a,b) => a.c.due - b.c.due);
  if(ready.length) return ready[0];
  // A card you just answered must not come straight back, so an unseen word
  // takes priority over one that is merely due soon.
  const first = all.find(w => !stateOf(w.id));
  if(first) return {w: first, c: fresh(first.id)};
  // Only once the deck is exhausted is it worth showing a learning card early,
  // rather than parking you on "all caught up" for the sake of a few minutes.
  const soon = seen
    .filter(x => (x.c.stage==='learning'||x.c.stage==='relearn') && x.c.due - now <= 20*MIN)
    .sort((a,b) => a.c.due - b.c.due);
  if(soon.length) return soon[0];
  return null;
}
function nextDueText(){
  const now = Date.now();
  const times = deck().map(w => stateOf(w.id)).filter(Boolean).map(c => c.due).filter(t => t > now);
  if(!times.length) return 'Nothing left to review.';
  return 'Next card in ' + human(Math.round((Math.min.apply(null,times) - now)/MIN)) + '.';
}

/* ============================================================
   SPEECH
   ============================================================ */
/* Pick a British female voice. Left to itself iOS grabs Daniel, the default
   en-GB voice, which is the deep robotic one. Named voices differ per device
   and per OS version, so score candidates rather than hard-coding one. */
const FEMALE = /serena|kate|stephanie|martha|sonia|libby|hazel|fiona|moira|tessa|samantha|karen|zira|susan|catherine|linda|amy|emma|jenny|aria|ava|clara|female/i;
const MALE   = /daniel|arthur|oliver|george|ryan|thomas|alex|fred|gordon|rishi|aaron|david|mark|james|guy|eric|christopher|brandon|liam|nathan|william/i;

let voice = null;
function pickVoice(){
  const all = speechSynthesis.getVoices()
    .filter(v => v.lang && v.lang.replace('_','-').toLowerCase().indexOf('en') === 0);
  if(!all.length) return;
  // Voice names differ wildly per device, so score rather than hard-code.
  // British first, then female: iOS otherwise defaults to Daniel, the deep one.
  const score = v => {
    const lang = v.lang.replace('_','-');
    let s = 0;
    if(lang === 'en-GB') s += 100;
    else if(/^en-(AU|IE|NZ|ZA)$/i.test(lang)) s += 40;
    if(FEMALE.test(v.name)) s += 50;
    else if(MALE.test(v.name)) s -= 60;      // checked second so "female" never reads as "male"
    if(/enhanced|premium|natural|neural/i.test(v.name)) s += 15;
    if(/compact|eloquence/i.test(v.name)) s -= 20;
    return s;
  };
  voice = all.slice().sort((a,b) => score(b) - score(a))[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  if(!voice) pickVoice();               // iOS often fills the list only after first use
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (voice && voice.lang) || 'en-GB';
  u.rate = .9; u.pitch = 1.05;
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);
let current = null, flipped = false, undoSnap = null;

function show(name){
  ['home','study','done'].forEach(s => $(s).classList.toggle('on', s === name));
  $('fab').style.display = (name === 'study') ? 'none' : 'grid';
  if(name === 'home') refreshHome();
}
function refreshHome(){
  const k = counts();
  $('sDue').textContent = k.due; $('sNew').textContent = k.neu; $('sKnown').textContent = k.known;
  $('goStudy').textContent = (k.due + k.neu) ? 'Start' : 'Review anyway';
}

/* Example sentences mark the target word with *asterisks* in words.csv,
   so the highlight lands on the right span whatever form the word takes
   (exacerbate -> *exacerbated*). Built as nodes, never innerHTML. */
function renderExample(el, text){
  el.textContent = '';
  if(!text) return;
  text.split(/(\*[^*]+\*)/).forEach(part => {
    if(!part) return;
    if(part[0] === '*' && part.length > 2){
      const s = document.createElement('span');
      s.className = 'hl';
      s.textContent = part.slice(1, -1);
      el.appendChild(s);
    } else el.appendChild(document.createTextNode(part));
  });
}

/* One language per block: its definition and its synonyms sit together under
   a single divider, with the synonyms as chips so they read as a set rather
   than a run-on line. */
function meaningBlock(defLabel, defText, synLabel, synText, isRussian){
  const sect = document.createElement('div');
  sect.className = 'sect' + (isRussian ? ' ru' : '');
  const h1 = document.createElement('h4'); h1.textContent = defLabel;
  const p  = document.createElement('p');  p.textContent  = defText || '';
  sect.appendChild(h1); sect.appendChild(p);

  const words = String(synText || '').split(',').map(s => s.trim()).filter(Boolean);
  if(words.length){
    const h2 = document.createElement('h4'); h2.className = 'sub'; h2.textContent = synLabel;
    const chips = document.createElement('div'); chips.className = 'chips';
    words.forEach(t => {
      const c = document.createElement('span'); c.className = 'chip'; c.textContent = t;
      chips.appendChild(c);
    });
    sect.appendChild(h2); sect.appendChild(chips);
  }
  return sect;
}

function render(){
  current = pickNext();
  if(!current){ $('doneSub').textContent = nextDueText(); show('done'); return; }
  const {w, c} = current;
  flipped = false;
  const card = $('card');
  card.classList.add('noanim');
  card.classList.remove('flipped');
  void card.offsetWidth;                    // commit the snap before animation returns
  card.classList.remove('noanim');
  $('answers').classList.remove('on');
  $('hint').style.display = '';

  $('fWord').textContent = w.word;
  $('fWord').className = 'front-word' + (w.word.length > 15 ? ' long' : '');
  $('fPos').textContent = w.pos || '';
  renderExample($('fEx'), w.ex);
  $('bWord').textContent = w.word;

  $('bBody').textContent = '';
  $('bBody').appendChild(meaningBlock('Definition', w.def, 'Synonyms', w.en, false));
  $('bBody').appendChild(meaningBlock('Значение', w.rudef, 'Синонимы', w.ru, true));

  const now = Date.now();
  $('tW').textContent = '(' + gap(c,'wrong',now) + ')';
  $('tH').textContent = '(' + gap(c,'hard', now) + ')';
  $('tE').textContent = '(' + gap(c,'easy', now) + ')';

  const k = counts();
  $('cDue').textContent = k.due; $('cNew').textContent = k.neu;
  $('undo').disabled = !undoSnap;
  $('bBody').scrollTop = 0;
}

function flip(){
  if(!current) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('answers').classList.toggle('on', flipped);
  $('hint').style.display = flipped ? 'none' : '';
}

function answer(r){
  if(!current || !flipped) return;
  const {w, c} = current;
  undoSnap = {id: w.id, prev: S.cards[w.id] ? JSON.parse(JSON.stringify(S.cards[w.id])) : null};
  S.cards[w.id] = apply(c, r, Date.now());
  save();
  render();
}

/* events */
$('cardWrap').addEventListener('click', e => { if(!e.target.closest('[data-speak]')) flip(); });
document.querySelectorAll('[data-speak]').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  if(current) speak(current.w.word);
}));
document.querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => answer(b.dataset.r)));
$('back').addEventListener('click', () => show('home'));
$('doneHome').addEventListener('click', () => show('home'));
$('goStudy').addEventListener('click', () => { undoSnap = null; show('study'); render(); });
$('undo').addEventListener('click', () => {
  if(!undoSnap) return;
  if(undoSnap.prev) S.cards[undoSnap.id] = undoSnap.prev; else delete S.cards[undoSnap.id];
  undoSnap = null; save(); render();
});
/* ============================================================
   REQUEST A WORD
   The request goes to Elijah's buffer worker, which pings him on
   Telegram. A request counts as "added" the moment the word turns up in
   the deck, so no reply channel is needed: publishing the word is the
   answer. Anything that fails to send stays queued and retries, since
   this gets used on a phone with patchy signal.
   ============================================================ */
const REQUEST_URL = 'https://claude-buffer.elijahrobineau.workers.dev/word-request';

function isInDeck(text){
  const t = text.trim().toLowerCase();
  return (window.WORDS || []).some(w => w.word.toLowerCase() === t);
}
function openSheet(){
  $('sheetBg').classList.add('on'); $('sheet').classList.add('on');
  $('reqInput').value = ''; $('reqSend').disabled = true;
  renderRequests(); flushQueue();
}
function closeSheet(){
  $('sheetBg').classList.remove('on'); $('sheet').classList.remove('on');
  $('reqInput').blur();
}
function renderRequests(){
  const list = $('mine');
  list.textContent = '';
  if(!S.requests.length) return;
  S.requests.slice().reverse().forEach(r => {
    const added = isInDeck(r.text);
    const row = document.createElement('div'); row.className = 'item';
    const p = document.createElement('p'); p.textContent = r.text;
    const tag = document.createElement('span');
    tag.className = 'status ' + (added ? 'added' : 'pending');
    tag.textContent = added ? '✓ added' : (r.sent ? 'pending' : 'not sent yet');
    row.appendChild(p); row.appendChild(tag); list.appendChild(row);
  });
}
const inflight = new Set();   // a send in progress is not yet "sent", but must not be repeated
function flushQueue(){
  S.requests.filter(r => !r.sent && !inflight.has(r.text)).forEach(r => {
    inflight.add(r.text);
    fetch(REQUEST_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({word: r.text, at: r.ts})
    }).then(res => {
      if(res.ok){ r.sent = true; save(); renderRequests(); }
    }).catch(() => {})        // stays queued, retried next time the sheet opens
      .then(() => inflight.delete(r.text));
  });
}
$('fab').addEventListener('click', openSheet);
$('sheetBg').addEventListener('click', closeSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('reqInput').addEventListener('input', function(){
  $('reqSend').disabled = !this.value.trim();
});
$('reqInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && this.value.trim()) $('reqSend').click();
});
$('reqSend').addEventListener('click', () => {
  const text = $('reqInput').value.trim().slice(0, 60);
  if(!text) return;
  if(!S.requests.some(r => r.text.toLowerCase() === text.toLowerCase())){
    S.requests.push({text, ts: new Date().toISOString(), sent: false});
    save();
  }
  $('reqInput').value = ''; $('reqSend').disabled = true;
  renderRequests(); flushQueue();
});

/* go */
load(); show('home');
</script>
