<!doctype html>
<html lang="en" data-palette="grove">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">
<meta name="theme-color" content="#E0CFAE">
<meta name="color-scheme" content="light dark">
<script>
/* Sun and moon, resolved BEFORE first paint, or the app flashes the wrong
   sheet on every launch. The choice lives under its own key and is never
   written anywhere near the progress key. Follows the phone until tapped. */
(function(){
  try{
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    var sys  = dark ? 'pine' : 'heartwood';
    var pal  = sys;
    /* A tap on the switch is an override for NOW, not a setting. It records the
       light the phone itself was in when it was made, and stands only while the
       phone is still in that light. The next time the phone flips, the override
       is dropped and the app follows it again: choosing daylight at one in the
       morning does not leave it light tomorrow night. */
    try{
      var o = JSON.parse(localStorage.getItem('vocab.theme') || 'null');
      if(o && o.basis === sys && (o.pal === 'heartwood' || o.pal === 'pine')) pal = o.pal;
      else if(o) localStorage.removeItem('vocab.theme');
    }catch(e){}
    document.documentElement.setAttribute('data-palette', pal);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', pal === 'heartwood' ? '#E0CFAE' : '#0A120D');
  }catch(e){}
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>Vocab</title>
<style>
/* ---------- TYPE ----------
   Both faces are self-hosted from fonts/, so the app still works with no
   network and makes no third-party request from the phone.
   Fraunces is the display serif (English words only, hence the latin range);
   Manrope carries everything else and covers Cyrillic for the Russian side. */
@font-face{
  font-family:'Fraunces'; src:url('fonts/fraunces-latin.woff2') format('woff2');
  font-weight:400 700; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+2000-206F,U+2122,U+2212,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Manrope'; src:url('fonts/manrope-latin.woff2') format('woff2');
  font-weight:400 800; font-style:normal; font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Manrope'; src:url('fonts/manrope-cyrillic.woff2') format('woff2');
  font-weight:400 800; font-style:normal; font-display:swap;
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}
@font-face{
  font-family:'Manrope'; src:url('fonts/manrope-cyrillic-ext.woff2') format('woff2');
  font-weight:400 800; font-style:normal; font-display:swap;
  unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;
}
:root{
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:'Fraunces',ui-serif,Georgia,'Times New Roman',serif;
}
/* Display type carries an optical-size axis: each place that uses Fraunces sets
   its own 'opsz' so the big word is drawn as display type and the small
   headings are drawn as text, rather than one outline scaled up and down. */

/* Palettes. Switch by changing data-palette on <html>: grove | linen | moss | clay | fern
   --bright is the sentence on the front, the one thing on the card that is
   near-white; --edge is the beige card outline; --chip-* keeps synonym text
   light inside its green pill rather than green-on-green. */
:root, [data-palette="grove"]{       /* warm forest floor, oat text, leaf accent */
  --bg:#141910;  --card:#1D2318;  --card-2:#28301F;
  --text:#EFE9D9; --bright:#FCFAF3; --muted:#A3A48D; --line:#333A2A; --ru-text:#E2DCC9;
  --edge:rgba(216,203,168,.42);
  --accent:#9DBE79; --on-accent:#12160E;
  --wrong:#D57F68; --hard:#DFAF66; --easy:#9DBE79;
  --hl-bg:rgba(157,190,121,.30); --hl-text:#F6F3E6;
  --chip-bg:rgba(157,190,121,.26); --chip-text:#F2EFE1;
  --hard-soft:rgba(215,165,93,.16); --easy-soft:rgba(157,190,121,.16);
  /* the ground is now lighter than the cards, so a card reads as an object
     lying on a surface rather than a hole cut in the dark */
  /* The fans are the card outline, continued across the ground: same beige and
     now the same strength, .42, so the two genuinely match. It was .10 before,
     which was the right colour at a quarter of the weight, and read as a
     different, dimmer thing rather than as the same line. */
  /* Card stock for the five original palettes, and the ink split every palette
     inherits unless it says otherwise. A card surface can carry different ink
     from the ground it lies on - Understorey is a pale leaf on a dark floor -
     so these four are redefined ON the card surfaces further down rather than
     being hunted through forty selectors. */
  --stock-lit:rgba(255,246,224,.13); --stock-shade:rgba(0,0,0,.35);
  --stock-vignette:rgba(0,0,0,.22);
  --card-ink:var(--text); --card-muted:var(--muted);
  --card-line:var(--line); --card-wrong:var(--wrong);
}
[data-palette="linen"]{              /* the daylight version: beige paper, deep green ink */
  --bg:#EFE9DC;  --card:#F8F4EA;  --card-2:#E7E0D0;
  --text:#1F251A; --bright:#141810; --muted:#7C7B69; --line:#DDD5C4; --ru-text:#39402F;
  --edge:rgba(120,106,74,.35);
  --accent:#4C6B3C; --on-accent:#F8F4EA;
  --wrong:#A9503C; --hard:#9A6E22; --easy:#4C6B3C;
  --hl-bg:rgba(76,107,60,.88); --hl-text:#F8F4EA;
  --chip-bg:rgba(76,107,60,.85); --chip-text:#F8F4EA;
  --hard-soft:rgba(154,110,34,.14); --easy-soft:rgba(76,107,60,.13);
}
[data-palette="moss"]{               /* deep green, sage accent */
  --bg:#0E1311;  --card:#161D19;  --card-2:#1F2823;
  --text:#ECF1ED; --bright:#FBFDFA; --muted:#8B978F; --line:#29332D; --ru-text:#C6D2C8;
  --edge:rgba(206,214,196,.34);
  --accent:#86B26A; --on-accent:#0E1311;
  --wrong:#E07A5F; --hard:#E0A458; --easy:#86B26A;
  --hl-bg:rgba(134,178,106,.32); --hl-text:#F4F8EE;
  --chip-bg:rgba(134,178,106,.28); --chip-text:#F1F6EB;
  --hard-soft:rgba(224,164,88,.17); --easy-soft:rgba(134,178,106,.17);
}
[data-palette="clay"]{               /* warm earth, olive accent */
  --bg:#14110E;  --card:#1E1A16;  --card-2:#282320;
  --text:#F3EDE5; --bright:#FEFBF6; --muted:#9C9086; --line:#342D27; --ru-text:#DED6CA;
  --edge:rgba(222,206,180,.38);
  --accent:#A8B98C; --on-accent:#14110E;
  --wrong:#CF7B62; --hard:#DBA75E; --easy:#A8B98C;
  --hl-bg:rgba(168,185,140,.32); --hl-text:#FAF6EC;
  --chip-bg:rgba(168,185,140,.28); --chip-text:#F7F3E9;
  --hard-soft:rgba(219,167,94,.17); --easy-soft:rgba(168,185,140,.17);
}
[data-palette="fern"]{               /* cool near-black green, mint accent */
  --bg:#0A100C;  --card:#121A15;  --card-2:#1A241D;
  --text:#E9F1EA; --bright:#FAFDFA; --muted:#7E8C83; --line:#22302A; --ru-text:#C3D2C7;
  --edge:rgba(200,214,202,.32);
  --accent:#6FC192; --on-accent:#08120C;
  --wrong:#D97B7B; --hard:#D3AA63; --easy:#6FC192;
  --hl-bg:rgba(111,193,146,.30); --hl-text:#F2FBF5;
  --chip-bg:rgba(111,193,146,.26); --chip-text:#EFF9F3;
  --hard-soft:rgba(211,170,99,.17); --easy-soft:rgba(111,193,146,.17);
}

/* ---------- HEARTWOOD & UNDERSTOREY ----------
   Two places rather than two brightnesses. Heartwood is a slice of timber seen
   in daylight: honey everywhere, growth rings running across the sheet as well
   as behind it, and green surviving only in the highlight, which is the one
   thing on the card that should read as a leaf. Understorey is the forest
   floor after rain - a dark moss ground carrying ferns, with the card a pale
   birch leaf lying on it.

   Understorey is why the ink is split in two. Its card is light and its ground
   is dark, so --text and --card-ink genuinely differ; every other palette
   leaves the card values alone and they resolve to the ground ones. */
[data-palette="heartwood"]{          /* a slice of timber, in daylight */
  --bg:#E0CFAE;  --card:#FAF4E8;  --card-2:#F1E8D6;
  --text:#3A2B17; --bright:#2A1D0B; --muted:#6A5836; --line:#E0D2B8; --ru-text:#41301A;
  --edge:rgba(122,92,50,.30);
  --accent:#4E6B33; --on-accent:#FAF4E8;
  --wrong:#8B4024; --hard:#6F4E0F; --easy:#42582A;
  --hl-bg:rgba(134,170,92,.46); --hl-text:#1B2610;
  --chip-bg:rgba(78,107,51,.14); --chip-text:#2C4322;
  --hard-soft:rgba(111,78,15,.12); --easy-soft:rgba(66,88,42,.12);
  --card-ink:#32240F; --card-muted:#7A6642; --card-line:#E0D2B8; --card-wrong:#8B4024;
  --sheet-light:linear-gradient(152deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.20) 32%,
                rgba(255,255,255,0) 50%, rgba(80,64,34,.20) 100%);
  --stock-lit:rgba(255,255,255,.85); --stock-shade:rgba(80,64,34,.14);
  --stock-vignette:rgba(80,64,34,.06);
  /* Daylight has no lamp to glow, so the same idea is carried by brightness on
     the card and by ink strength on the answers: nothing glows on a pale ground. */
  --lamp:rgba(255,255,255,.80); --lamp-glow:none;
  --ans-dim:.74; --ans-mid:.88; --ans-top:var(--easy);
  --ans-glow-mid:none; --ans-glow-top:none;
}
/* On a pale ground the fade cannot go as far as it does at night - at half
   strength Wrong fell to 2:1 - so daylight carries the rest of the scale in
   the weight of the word. */
[data-palette="heartwood"] .ans.w b{font-weight:500;}
[data-palette="heartwood"] .ans.e b{font-weight:800;}

[data-palette="pine"]{               /* a pine-green room, one cream accent */
  /* Heartwood is a cream card with a green accent. This is its mirror: green is
     the room and cream is the accent, so the two themes swap roles when the
     phone switches rather than becoming a different design.
     The card sits two clear steps above the ground. The theme before this had
     them 4% apart, which is too little to read as an object and too much to
     read as one surface. */
  --bg:#0A120D;  --card:#14231A;  --card-2:#1B2D22;
  --text:#C4D3C8; --bright:#E3EBE5; --muted:#71857A; --line:#223528; --ru-text:#DCE8DF;
  --edge:rgba(220,232,223,.14);
  /* The accent is a WARM cream on purpose. A paler one sat 17 dE from the
     sentence around it and the marked word vanished; this is 40 away, so the
     word is found by its warmth against a cool white, not by weight or a box. */
  --accent:#EBCB82; --on-accent:#0E1710;
  --wrong:#B79E68; --hard:#D2B676; --easy:#EBCB82;
  --hl-bg:rgba(235,203,130,.24); --hl-text:#F0F6F1;
  --chip-bg:rgba(235,203,130,.16); --chip-text:#F0E6C8;
  --hard-soft:rgba(235,203,130,.14); --easy-soft:rgba(235,203,130,.16);
  --card-ink:#DCE8DF; --card-muted:#7F9486; --card-line:#223528; --card-wrong:#C9A56A;
  --sheet-light:linear-gradient(162deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.015) 34%,
                rgba(0,0,0,0) 52%, rgba(0,0,0,.28) 100%);
  --stock-lit:rgba(255,255,255,.05); --stock-shade:rgba(0,0,0,.45);
  --stock-vignette:rgba(0,0,0,.25);
  /* the lamp on the front of the card, and the light the answers give off */
  --lamp:rgba(235,203,130,.13); --lamp-glow:0 0 26px rgba(235,203,130,.35);
  --ans-dim:.55; --ans-mid:.86; --ans-top:#FFF0C9;
  --ans-glow-mid:0 0 12px rgba(235,203,130,.40);
  --ans-glow-top:0 0 6px rgba(235,203,130,.90), 0 0 20px rgba(235,203,130,.65), 0 0 40px rgba(235,203,130,.40);
  /* The marked word is not dyed. It stays the white of the sentence around it
     and sits in a pool of light, as the headword does on the front - so the
     word reads as the SOURCE of the light rather than as a coloured word with
     a light added. Each pool peaks behind the text and fades out past it; a
     flat fill with a blur round it looks like a smudged highlight, not a lamp. */
  --mark-ink:var(--bright);
  --mark-glow:0 0 16px rgba(235,203,130,.45);
  /* the fill meets its halo at the same strength at the edge of the box (the
     two halos sum to about .14 there). Any step between them shows as a rim,
     and a lamp has no outline. */
  --mark-pool:radial-gradient(closest-side, rgba(235,203,130,.240), rgba(235,203,130,.140));
  --mark-halo:0 0 22px 8px rgba(235,203,130,.110), 0 0 64px 26px rgba(235,203,130,.070);
  /* the translations share one light under the whole row, not a blob each */
  --row-pool:radial-gradient(closest-side, rgba(235,203,130,.150), rgba(235,203,130,.092));
  --row-halo:0 0 22px 8px rgba(235,203,130,.072), 0 0 64px 26px rgba(235,203,130,.047);
}


:root{
  --pad-bottom: max(14px, env(safe-area-inset-bottom));
  --pad-top: max(10px, env(safe-area-inset-top));
}

/* ---------- NIGHT SKY ----------
   Ink only. One element per star, each sitting at a fixed point and changing
   nothing but its own opacity, on its own duration and its own delay.
   The first attempt faded two whole layers of gradients in and out instead.
   Nothing actually moved, but a hundred points brightening and dimming in
   unison reads as drift across the screen, which is the opposite of a sky.
   A star has to stay exactly where it is and only breathe. */
.sky{display:none; position:fixed; inset:0; pointer-events:none; z-index:0;
  overflow:hidden; contain:strict;}
[data-palette="pine"] .sky{display:block;}
.sky i{position:absolute; border-radius:50%; background:#E4EFE6;
  opacity:var(--o);
  animation:star var(--t) ease-in-out var(--d) infinite;
  will-change:opacity;}
/* only opacity is animated: no transform, no position, nothing that could
   shift a star off its point */
@keyframes star{
  0%,100%{opacity:calc(var(--o) * .18)}
  50%    {opacity:var(--o)}
}
@media (prefers-reduced-motion:reduce){ .sky i{animation:none; opacity:calc(var(--o) * .7);} }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}

body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
.screen{position:fixed; inset:0; display:none; flex-direction:column; z-index:1;
  padding:var(--pad-top) 14px var(--pad-bottom);}
.screen.on{display:flex;}

/* ---------- HOME ----------
   Built as a card, so the app opens on the same object it teaches with:
   the card surface, the beige edge and the radius are the ones from .face. */
#home{justify-content:center; align-items:center; text-align:center;}
.theme-btn{position:absolute; top:calc(var(--pad-top) + 6px); right:10px;
  width:60px; height:60px; border-radius:50%; display:grid; place-items:center;
  color:var(--muted); z-index:10;}
.theme-btn svg{width:30px; height:30px; fill:currentColor;}
.theme-btn:active{transform:scale(.92);}
.home-card{width:100%; max-width:420px; min-height:56vh; position:relative; overflow:hidden;
  background:var(--card); border:1px solid var(--edge); border-radius:24px;
  padding:34px 22px 30px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;}
#home h1{font-family:var(--serif); font-variation-settings:'opsz' 144; font-size:44px;
  font-weight:600; letter-spacing:-.01em; margin:0;}
/* A hairline capsule in the accent, sitting dead straight: the stamp without the
   tilt. A border gives the line something to be, which is what the bare tracked
   caps that started here never had. */
#home .sub{color:var(--accent); font-size:12.5px; font-weight:600; letter-spacing:.01em;
  border:1px solid var(--accent); border-radius:999px; padding:5px 13px;
  margin-top:14px; margin-bottom:28px;}
.stats{display:flex; gap:10px; width:100%; margin-bottom:26px;}
.stat{flex:1; background:var(--card-2); border:1px solid var(--line); border-radius:16px;
  padding:14px 8px;}
.stat b{display:block; font-family:var(--serif); font-variation-settings:'opsz' 60;
  font-size:26px; font-weight:600; letter-spacing:0;}
.stat span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em;}
.btn-main{width:100%; max-width:420px; background:var(--accent); color:var(--on-accent); font-weight:700;
  font-size:17px; padding:16px; border-radius:16px;}
.btn-ghost{width:100%; max-width:420px; background:var(--card); color:var(--text);
  font-size:15px; padding:14px; border-radius:16px; margin-top:10px;}
#home .note{max-width:340px; margin:20px 0 0; font-size:12.5px; line-height:1.5; color:var(--muted);}

/* ---------- STUDY ---------- */
#study{padding-left:12px; padding-right:12px;}
.top{display:flex; align-items:center; justify-content:space-between; height:56px; flex:0 0 auto;}
.top-right{display:flex; align-items:center;}
.top .counts{display:flex; gap:14px; font-size:12px; color:var(--muted);
  font-variant-numeric:tabular-nums;}
.top .counts em{font-style:normal; color:var(--text); font-weight:650;}
/* Twice the old 38px. These were small enough to need aiming at, which is
   the wrong thing to ask of a thumb halfway through a review. */
.icon-btn{width:56px; height:56px; display:grid; place-items:center; color:var(--muted); font-size:30px;}
.icon-btn svg{width:28px; height:28px; fill:currentColor;}
.icon-btn:disabled{opacity:.25;}

.card-wrap{flex:1 1 auto; position:relative; perspective:1400px; margin:8px 0 12px; min-height:0;}
.card{position:absolute; inset:0; transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.22,.68,.28,1);}
.card.flipped{transform:rotateY(180deg);}
/* a new card should snap to its front, not reverse-flip and flash its answer */
.card.noanim, .card.noanim .face{transition:none !important;}
.face, .home-card{
  box-shadow:inset 0 1px 0 var(--stock-lit), inset 0 -1px 0 var(--stock-shade),
             inset 0 0 44px var(--stock-vignette);
  /* Contains the blended layers below to this one surface. The last attempt at
     the blended layers on this surface to it. */
  isolation:isolate;
}
/* Every card surface states its own ink, and restates the three shared inks for
   everything inside it. Custom properties inherit, so one rule here reaches
   every descendant - the headword, the part of speech, the rules between
   blocks - without touching their selectors. Without this a pale card on a
   dark ground renders light text on light paper, which is exactly the failure
   this app has hit before. .speaker is in the list because it is a card-
   coloured object even though it sits outside the face. */
.face, .home-card, .sheet, .speaker{
  color:var(--card-ink);
  --text:var(--card-ink);
  --muted:var(--card-muted);
  --line:var(--card-line);
  --wrong:var(--card-wrong);
}
/* One raking pass of light across the sheet, above the type so it falls on the
   ink as well as the paper. It takes no z-index: a positioned child of a .face
   with one is pulled out of the 3D context and detaches mid-flip. */
.face::before, .home-card::before{
  content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:var(--sheet-light, none); mix-blend-mode:soft-light;
}

.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border:1px solid var(--edge);
  border-radius:24px; display:flex; flex-direction:column; overflow:hidden;
  /* An identity transform gives each face its own 3D context, so the speaker
     button is flattened onto the face instead of floating on its own plane
     mid-turn. Without this the button visibly detaches while the card flips. */
  transform:rotateY(0deg);}
.face.back{transform:rotateY(180deg);}
/* The front of the card is one word on an empty sheet, so it is lit like one:
   a pool of warm light behind the middle and a trace of it on the word. The
   word stays its own colour - it is the card that is lit, not the type. */
.face.front{background-image:radial-gradient(80% 40% at 50% 48%, var(--lamp, transparent), transparent 72%);}
.face.front .front-word{text-shadow:var(--lamp-glow, none);}

/* Bottom right of the card, above both faces and outside their 3D context. */
.speaker{position:absolute; right:16px; bottom:16px; width:58px; height:58px; border-radius:50%;
  background:var(--card-2); border:1px solid var(--edge); display:grid; place-items:center;
  z-index:6; box-shadow:0 4px 14px rgba(0,0,0,.28);}
.speaker svg{width:26px; height:26px; fill:var(--text);}
.speaker:active{background:var(--line); transform:scale(.94);}
.speaker.speaking{background:var(--accent); border-color:var(--accent);}
.speaker.speaking svg{fill:var(--on-accent);}

/* Sentence first, word underneath: the point is to meet the word in context
   and only then name it. */
.front-body{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:30px 22px 84px; text-align:center; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.example{max-width:340px; font-size:22px; line-height:1.48; color:var(--bright); font-weight:500;
  letter-spacing:-.004em;}
/* The highlight is grown with a spread shadow rather than padding, so it takes
   no extra width in the line: padding would push the following comma away from
   the word and leave a hole in the sentence. */
/* One highlight, used in two places: the target word inside the sentence on
   the front, and the possible translations on the back. It was scoped to
   .example, so the translations rendered with the markup and none of the green. */
/* How the target word is marked depends on the light.
   At night it is lit, not coloured: see --mark-* in the pine palette.
   By day there is no lamp - light does not show on a pale card - so the word
   takes the accent colour instead and nothing else, which is what every
   palette without --mark-* values falls back to.
   Either way nothing about the SHAPE of the line changes: no rule, no block,
   no extra weight. */
.context .hl{text-decoration:none; font-weight:inherit; border-radius:999px;
  color:var(--mark-ink, var(--accent));
  background:var(--mark-pool, none); box-shadow:var(--mark-halo, none);
  text-shadow:var(--mark-glow, none);}
.hl{background:var(--hl-bg); color:var(--hl-text); font-weight:600;
  border-radius:5px; box-shadow:0 0 0 3px var(--hl-bg);
  /* idioms are several words long and wrap: clone gives each line fragment its
     own rounded box instead of one shape stretched across the break */
  -webkit-box-decoration-break:clone; box-decoration-break:clone;}
.example:empty{display:none;}
.front-word{font-family:var(--serif); font-variation-settings:'opsz' 144; font-size:38px;
  font-weight:600; letter-spacing:-.008em; line-height:1.08; word-break:break-word;}
/* idioms are whole phrases, so the display size steps down by length */
.front-word.long{font-size:28px;}
.front-word.longer{font-size:22px; line-height:1.2;}
/* Lowercase serif, the way a dictionary sets it - not small uppercase on wide
   tracking, which is the house style of every app built in the last two years
   and reads as exactly that. */
.pos{margin-top:14px; color:var(--card-muted); font-family:var(--serif);
  font-variation-settings:'opsz' 24; font-size:17px; font-weight:400; letter-spacing:0;}

/* The back is two equal halves. Equal because the rule between them has to sit
   on the true middle of the card, the way the rule on the front sits under the
   sentence: same hairline, same colour, full width. Everything that used to
   label a block is gone - no repeated headword, no DEFINITION, no SYNONYMS, no
   ЗНАЧЕНИЕ. What is English and what is Russian is obvious from the words. */
.back-body{flex:1; display:flex; flex-direction:column; min-height:0;}
/* 50% each, not flex:1 with a zero basis: box-sizing is border-box, so a zero
   basis has the padding added back on afterwards and the half carrying the
   speaker clearance ends up 73px taller than the other. Pinning both to half
   the card is the only way the rule lands on the true middle. */
.back-half{flex:0 0 50%; min-height:0; display:flex; flex-direction:column;
  align-items:center; text-align:center; padding:0 22px; overflow-y:auto;
  -webkit-overflow-scrolling:touch;}
/* the same 30px above and 26px below that the front keeps around its rule */
.back-half.top{justify-content:flex-end; padding-bottom:30px;}
.back-half.bottom{justify-content:flex-start; padding-top:26px;
  border-top:1px solid var(--line); padding-bottom:68px;}  /* clears the speaker */

/* The definition is set exactly as the sentence on the front is set: same
   size, same leading, same measure, same ink. It is the same kind of thing. */
/* The context reads exactly as the sentence used to on the front: same size,
   leading, measure and ink. It is the same thing, moved. */
.context{max-width:340px; font-size:20px; line-height:1.5; color:var(--bright);
  font-weight:500; letter-spacing:-.004em;}
.context:empty{display:none;}

/* The Russian is where the translations live, highlighted exactly as the
   target word is highlighted inside the sentence on the front. The gap clears
   the 3px spread each highlight carries, so they do not touch. */
/* The translations are marked the same way the target word is marked in the
   sentence above: by not being marked. No block, no fill, no border - they are
   simply the brightest thing in the lower half, which on a card holding two
   lines of text is all the emphasis anything needs. The green block was the
   second green on the screen and it was winning against the first. */
/* Marked exactly as the target word is marked in the sentence above: the accent
   colour and nothing else. Same weight as the text around it, no fill, no rule,
   no extra boldness - one treatment used in both halves of the card. */
/* 18px against the sentence's 22, and that is what makes them LOOK the same
   size. The letters are identical in height at equal sizes - measured - but
   Cyrillic lowercase has almost no narrow letters and nearly every one fills
   the full x-height, so a Russian word reads as a wider, denser block than an
   English one. Matching the number made it look a size too big. */
.ru-words{display:flex; flex-wrap:wrap; justify-content:center; gap:10px 16px;
  max-width:340px; font-size:18px; line-height:1.48; font-weight:500;
  border-radius:999px; background:var(--row-pool, none); box-shadow:var(--row-halo, none);}
.ru-words:empty{display:none;}
.ru-words .hl{background:none; box-shadow:none; text-decoration:none;
  border-radius:0; padding:0; font-weight:inherit;
  color:var(--mark-ink, var(--accent)); text-shadow:var(--mark-glow, none);}

/* More. Everything that is reference rather than recall lives behind it, so the
   card itself stays two lines and a translation. */
/* Two thirds of the way down the lower half rather than on the floor of the
   card: at 22px it read as a footer, not as part of the block it belongs to. */
.more-btn{position:absolute; left:50%; transform:translateX(-50%); bottom:16%;
  background:none; border:0; padding:10px 18px; cursor:pointer;
  font:600 15px/1 var(--sans); color:var(--card-muted);
  text-decoration:underline; text-underline-offset:4px;}
/* THE MORE PANEL
   Two rows. The body takes whatever is left and centres its contents; the foot
   holds the X and nothing else. So the X is in the same place on every card,
   whatever the panel is showing, and there is never anything for it to land on.

   The clip gets a box of fixed height. That is the whole fix for the spacing:
   clips come in every proportion, and one that was square took its full width
   as its height and crushed everything else against the edges. Inside the box
   the image is scaled down to fit, never cropped - a lot of these have a
   caption along the bottom - so a square clip sits centred and a wide one
   fills the width, and the panel is the same height either way.

   Nothing scrolls. Every card was measured against this; the longest entry in
   the deck fits with room to spare. */
.more-btn.open{display:none;}        /* the panel carries its own way out */
.more-btn:focus-visible{outline:2px solid currentColor; outline-offset:2px; border-radius:8px;}
.more-panel{position:absolute; inset:0; background:var(--card); border-radius:inherit;
  display:flex; flex-direction:column;}
.more-panel[hidden]{display:none;}
.more-body{flex:1 1 auto; min-height:0; overflow:hidden; text-align:center;
  padding:26px 26px 0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
/* The headword stands over its definition as a title, in the same face it has
   on the front of the card. Run into the sentence with a colon it was one more
   thing to read past; above it, it is simply what the panel is about. */
.more-word{font-family:var(--serif); font-variation-settings:'opsz' 96; font-weight:600;
  font-size:31px; line-height:1.1; letter-spacing:-.016em; color:var(--card-ink);
  max-width:330px; word-break:break-word;}
.more-word.long{font-size:25px;}
.more-word.longer{font-size:21px; line-height:1.18;}
.more-def{max-width:330px; font-size:19px; line-height:1.45; font-weight:500; color:var(--bright);}
.more-syn{max-width:330px; font-size:16.5px; line-height:1.45; color:var(--card-muted);}
.more-clip{display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:6px;}
/* --clip-h is the height of the box AND the ceiling on the image inside it,
   stated in pixels both times. A percentage max-height on the image did not
   resolve against the box, so a square clip ran 32px out of it and over the
   credit underneath. */
.more-gif{--clip-h:188px; width:292px; max-width:100%; height:var(--clip-h);
  display:flex; align-items:center; justify-content:center;}
.more-gif:empty{display:none;}
.more-gif img{max-width:100%; max-height:var(--clip-h); width:auto; height:auto;
  border-radius:10px; display:block;}
/* a short phone gives the panel 180px less to work with, and the clip is the
   only thing in it that can give any back */
@media (max-height:720px){ .more-gif{--clip-h:128px;} .more-body{gap:11px; padding-top:18px;} }
/* The attribution is the licence. GIPHY's API is free, commercial use included,
   on the condition that this is shown wherever their clips are. It appears only
   when a clip actually did. */
.gif-credit{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:700; color:var(--card-muted); opacity:.75;}
.gif-credit[hidden]{display:none;}
/* The X sits level with the speaker button beside it: same 54px, same distance
   off the floor of the card, so the bottom edge reads as one row. */
.more-foot{flex:0 0 auto; display:grid; place-items:center; padding:12px 0 20px;}
.more-close{width:54px; height:54px; border-radius:50%;
  display:grid; place-items:center; cursor:pointer; font-size:24px; line-height:1;
  border:1px solid var(--card-line); background:var(--card-2); color:var(--card-ink);}
.more-close:focus-visible{outline:2px solid currentColor; outline-offset:2px;}

.hint{flex:0 0 auto; text-align:center; color:var(--muted); font-size:13px; padding:20px 0 22px;}
.answers{flex:0 0 auto; display:none; gap:8px;}
.answers.on{display:flex;}
.ans{flex:1; border-radius:16px; padding:12px 4px 10px; background:var(--card);
  border:1px solid var(--edge);
  display:flex; flex-direction:column; align-items:center; gap:2px;}
.ans b{font-size:15.5px; font-weight:650;}
.ans span{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
.ans{transition:transform .12s ease, filter .12s ease;}
.ans:active{transform:scale(.955); filter:brightness(1.12);}
.ans.w b{color:var(--wrong);} .ans.h b{color:var(--hard);} .ans.e b{color:var(--easy);}
/* Words only. No buttons are drawn: three words, dim to lit, so the card is the
   only object on the screen and the answers read as a scale by light alone.
   The tap targets are exactly as large as before - the whole third of the row
   under each word still takes the tap, it just is not outlined. */
.ans.w, .ans.h, .ans.e{background:transparent; border-color:transparent;}
.ans b{font-size:18px;}
.ans.w b{color:var(--easy); opacity:var(--ans-dim, .55);}
.ans.h b{color:var(--easy); opacity:var(--ans-mid, .86); text-shadow:var(--ans-glow-mid, none);}
.ans.e b{color:var(--ans-top, var(--easy)); text-shadow:var(--ans-glow-top, none);}
.ans.e span{color:var(--muted);}

/* ---------- DONE ---------- */
#done{justify-content:center; align-items:center; text-align:center; gap:8px;}
#done .big{font-family:var(--serif); font-variation-settings:'opsz' 96; font-size:30px;
  font-weight:600; letter-spacing:-.005em;}
#done .sub{color:var(--muted); font-size:15px; margin-bottom:24px;}


/* ---------- MOTION ----------
   Everything here is the card behaving like a card: it is dealt, it is turned,
   it is put aside. Nothing moves for its own sake and nothing loops except the
   sky. All of it is inside no-preference, so a phone set to reduce motion gets
   the app exactly as it was. */
@media (prefers-reduced-motion:no-preference){
  /* answered: the card leaves the way you judged it */
  @keyframes leaveWrong{to{transform:translateX(-44%) rotate(-6deg); opacity:0;}}
  @keyframes leaveHard {to{transform:translateY(16%) scale(.95);     opacity:0;}}
  @keyframes leaveEasy {to{transform:translateX(44%) rotate(6deg);   opacity:0;}}
  .card-wrap.leave-wrong{animation:leaveWrong .2s cubic-bezier(.4,0,1,1) forwards;}
  .card-wrap.leave-hard {animation:leaveHard  .2s cubic-bezier(.4,0,1,1) forwards;}
  .card-wrap.leave-easy {animation:leaveEasy  .2s cubic-bezier(.4,0,1,1) forwards;}
  /* and the next one is dealt up from the pile */
  @keyframes dealIn{from{transform:translateY(18px) scale(.965); opacity:0;} to{transform:none; opacity:1;}}
  .card-wrap.enter{animation:dealIn .3s cubic-bezier(.2,.8,.3,1);}

  /* the opening screen assembles itself, top to bottom */
  @keyframes rise{from{transform:translateY(12px); opacity:0;} to{transform:none; opacity:1;}}
  #home.on .home-card{animation:dealIn .42s cubic-bezier(.2,.8,.3,1);}
  #home.on .home-card > *{animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards;}
  #home.on .home-card > *:nth-child(1){animation-delay:.08s;}
  #home.on .home-card > *:nth-child(2){animation-delay:.14s;}
  #home.on .home-card > *:nth-child(3){animation-delay:.20s;}
  #home.on .home-card > *:nth-child(4){animation-delay:.27s;}

  /* the answers arrive with the turn of the card rather than popping in */
  .answers.on .ans{animation:rise .32s cubic-bezier(.2,.8,.3,1) backwards;}
  .answers.on .ans:nth-child(2){animation-delay:.045s;}
  .answers.on .ans:nth-child(3){animation-delay:.09s;}

  /* More opens like a page laid over the card */
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .more-panel:not([hidden]){animation:fadeIn .2s ease-out;}
  .more-panel:not([hidden]) .more-body > *{animation:rise .34s cubic-bezier(.2,.8,.3,1) backwards;}
  .more-panel:not([hidden]) .more-body > *:nth-child(2){animation-delay:.04s;}
  .more-panel:not([hidden]) .more-body > *:nth-child(3){animation-delay:.08s;}
  .more-panel:not([hidden]) .more-body > *:nth-child(4){animation-delay:.12s;}

  #done.on > *{animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards;}
  #done.on > *:nth-child(2){animation-delay:.08s;}
  #done.on > *:nth-child(3){animation-delay:.16s;}

  .btn-main, .fab, .speaker, .more-close, .icon-btn, .theme-btn{transition:transform .12s ease;}
  .btn-main:active{transform:scale(.975);}

  /* once in a while, a shooting star. Night only; gone in under a second. */
  @keyframes shoot{0%{transform:translate3d(0,0,0) rotate(24deg); opacity:0;}
    12%{opacity:.9;} 100%{transform:translate3d(190px,84px,0) rotate(24deg); opacity:0;}}
  .sky .shoot{position:absolute; width:70px; height:1.2px; border-radius:2px;
    background:linear-gradient(90deg, rgba(228,239,230,0), rgba(228,239,230,.9));
    animation:shoot .95s ease-out forwards;}
}

/* ---------- FAB + SHEET ---------- */
.fab{position:fixed; right:18px; bottom:calc(var(--pad-bottom) + 14px);
  width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--on-accent);
  font-size:31px; font-weight:300; line-height:1; display:grid; place-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.34); z-index:40;}
.fab:active{transform:scale(.94);}
/* Only ever seen if an update lands mid-review, when reloading underneath
   someone would be rude. Bottom left, opposite the plus. */
.update-pill{position:fixed; left:16px; bottom:calc(var(--pad-bottom) + 16px);
  display:flex; align-items:center; gap:8px; z-index:60;
  background:var(--accent); color:var(--on-accent); font-size:13px; font-weight:700;
  padding:10px 15px; border-radius:22px; box-shadow:0 6px 18px var(--shadow-soft, rgba(0,0,0,.28));}
.update-pill[hidden]{display:none;}
.updating{position:fixed; inset:0; z-index:80; background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;}
.updating[hidden]{display:none;}
.updating p{margin:14px 0 0; font-family:var(--serif); font-variation-settings:'opsz' 72;
  font-size:26px; font-weight:600; letter-spacing:-.01em;}
.updating span{font-size:14px; color:var(--muted);}
.updating .dots{display:flex; gap:7px;}
.updating .dots i{width:7px; height:7px; border-radius:50%; background:var(--accent);
  animation:updot 1.1s ease-in-out infinite;}
.updating .dots i:nth-child(2){animation-delay:.15s;}
.updating .dots i:nth-child(3){animation-delay:.3s;}
@keyframes updot{0%,100%{opacity:.25; transform:translateY(0)} 40%{opacity:1; transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){ .updating .dots i{animation:none; opacity:.7;} }
.update-pill i{width:7px; height:7px; border-radius:50%; background:var(--on-accent);
  animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
.update-pill:active{transform:scale(.96);}
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:none;}
.sheet-bg.on{display:block;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--card);
  border-radius:22px 22px 0 0; padding:8px 16px var(--pad-bottom); max-height:92vh;
  display:none; flex-direction:column; transform:translateY(0);}
.sheet.on{display:flex;}
.grab{width:38px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 12px;}
.sheet h3{margin:0 0 14px; font-family:var(--serif); font-variation-settings:'opsz' 72;
  font-size:22px; font-weight:600; letter-spacing:-.005em;}
.req-row{display:flex; gap:9px;}
.req-row input{flex:1; min-width:0; background:var(--card-2); border:1px solid var(--line);
  border-radius:14px; color:var(--text); padding:13px; font-size:16px; font-family:inherit;}
.req-row input:focus{outline:none; border-color:var(--accent);}
.req-row button{flex:0 0 auto; padding:13px 22px; border-radius:14px; font-size:16px; font-weight:650;}
.req-note{font-size:12.5px; line-height:1.45; color:var(--muted); margin:11px 2px 0;}
.status{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; flex:0 0 auto;
  letter-spacing:.02em;}
.status.pending{background:var(--hard-soft); color:var(--hard);}
.status.added{background:var(--easy-soft); color:var(--easy);}
.sheet .row{display:flex; gap:10px; margin-top:14px;}
.sheet .row button{flex:1; padding:15px; border-radius:15px; font-size:16px; font-weight:600;}
.cancel{background:var(--card-2);}
.save{background:var(--accent); color:var(--on-accent);}
.save:disabled{opacity:.4;}
.mine{margin-top:20px; border-top:1px solid var(--line); padding-top:14px; overflow-y:auto;}
.mine .item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.mine .item p{flex:1; margin:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mine .item button{color:var(--wrong); font-size:14px; padding:6px 8px;}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen on">
  <!-- The light is a choice, not the phone's: it follows the system until this
       is tapped, then remembers. Home screen only, because the study screen's
       top right is the undo button and that has to stay where the thumb is. -->
  <button class="theme-btn" id="themeBtn" aria-label="Switch between light and dark"></button>
  <!-- The home screen is itself a card: same surface, same beige edge, same
       radius as the ones you study, so the app opens on its own vocabulary. -->
  <div class="home-card">
    <h1>Vocab</h1>
    <div class="sub" id="homeSub">IELTS high-band words</div>
    <div class="stats">
      <div class="stat"><b id="sDue">0</b><span>Due</span></div>
      <div class="stat"><b id="sNew">0</b><span>New</span></div>
      <div class="stat"><b id="sKnown">0</b><span>Learned</span></div>
    </div>
    <button class="btn-main" id="goStudy">Start</button>
  </div>
</section>

<!-- ============ STUDY ============ -->
<section id="study" class="screen">
  <div class="top">
    <button class="icon-btn" id="back">&#10005;</button>
    <div class="counts">
      <span>Due <em id="cDue">0</em></span>
      <span>New <em id="cNew">0</em></span>
    </div>
    <div class="top-right">
      <!-- the light switch is reachable mid-review too, not only from home -->
      <button class="icon-btn" id="themeBtnStudy"></button>
      <button class="icon-btn" id="undo" disabled>&#8634;</button>
    </div>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <div class="face front">
        <!-- The word, and what kind of word it is. Nothing else, dead centre.
             The sentence moved to the back: meeting the word cold and having to
             reach for it is the whole exercise, and a sentence on the front
             hands you the answer before you have tried. -->
        <div class="front-body">
          <div class="front-word" id="fWord"></div>
          <div class="pos" id="fPos"></div>
        </div>
      </div>
      <div class="face back">
        <!-- Two halves of equal height, so the rule between them lands on the
             exact middle of the card. The context sits just above it, the
             Russian just below, and everything else is behind More. -->
        <div class="back-body">
          <div class="back-half top">
            <div class="context" id="bCtx"></div>
          </div>
          <div class="back-half bottom">
            <div class="ru-words" id="bRu"></div>
          </div>
        </div>
        <!-- No z-index anywhere in here. A positioned child of a .face that has
             one is pulled out of the 3D context and visibly detaches mid-flip.
             DOM order alone puts the panel above the card body and the button
             above the panel, which is all this needs. -->
        <div class="more-panel" id="morePanel" hidden>
          <div class="more-body">
            <div class="more-word" id="mWord"></div>
            <div class="more-def" id="mDef"></div>
            <div class="more-syn" id="mSyn"></div>
            <div class="more-clip">
              <div class="more-gif" id="mGif"></div>
              <div class="gif-credit" id="mGifCredit" hidden>Powered By GIPHY</div>
            </div>
          </div>
          <div class="more-foot">
            <button class="more-close" id="moreClose" aria-label="Hide the definition">&#10005;</button>
          </div>
        </div>
        <button class="more-btn" id="moreBtn" aria-expanded="false">more</button>
      </div>
    </div>
    <!-- The speaker lives outside the card, not on a face. Safari's hit testing
         inside a preserve-3d subtree sent taps to the card underneath, which is
         why it used to flip instead of speak. Out here it is a plain button,
         and one button serves both sides. -->
    <button class="speaker" id="spk" aria-label="Say the word">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.6 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg>
    </button>
  </div>

  <div class="hint" id="hint">Tap the card to reveal</div>
  <div class="answers" id="answers">
    <button class="ans w" data-r="wrong"><b>Wrong</b><span id="tW">1m</span></button>
    <button class="ans h" data-r="hard"><b>Hard</b><span id="tH">5m</span></button>
    <button class="ans e" data-r="easy"><b>Easy</b><span id="tE">10m</span></button>
  </div>
</section>

<!-- ============ DONE ============ -->
<section id="done" class="screen">
  <div class="big">All caught up</div>
  <div class="sub" id="doneSub"></div>
  <button class="btn-main" id="doneHome">Back to start</button>
</section>

<div class="sky" id="sky" aria-hidden="true"></div>

<button class="fab" id="fab">+</button>
<button class="update-pill" id="updatePill" hidden><i></i>Update ready</button>

<!-- Shown for the second or two an update takes. Without it that pause looks
     exactly like the app having died, which is what sent people to force-quit. -->
<div class="updating" id="updating" hidden>
  <div class="dots"><i></i><i></i><i></i></div>
  <p>Updating</p>
  <span>This only takes a moment</span>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>Request a word</h3>
  <div class="req-row">
    <input id="reqInput" type="text" inputmode="text" autocomplete="off" autocapitalize="none"
           autocorrect="off" placeholder="Word or phrase">
    <button class="save" id="reqSend" disabled>Send</button>
  </div>
  <p class="req-note">Sent straight to Elijah. It turns green once the word is in the deck.</p>
  <div class="mine" id="mine"></div>
  <div class="row"><button class="cancel" id="closeSheet">Done</button></div>
</div>

<script src="words.js"></script>
<script src="contexts.js"></script>
<script>
/* ============================================================
   STORAGE  —  progress lives in this browser, on this device
   ============================================================ */
/* NEVER change this key. Progress is keyed by the word itself, not by its
   position in the deck, so words can be added, reordered or removed and every
   remaining card keeps its schedule. Shipping a new version of the app must
   never cost the user their reviews: load() therefore repairs whatever it
   finds rather than discarding it, and unknown fields are left untouched so
   an older build cannot destroy data written by a newer one. */
const KEY = 'vocab.main.v2';
let S = null;

/* A one-time reset, asked for when the cards were rebuilt. It runs once per
   device: the stamp is written into the same record, so a second launch sees it
   and leaves the schedule alone.

   It ARCHIVES before it clears. The cards go to their own dated key in the same
   browser, untouched, so this is reversible for as long as that key survives -
   which matters, because every other rule in this app exists to stop progress
   being lost by accident and this is the one time it goes deliberately. The
   archive is written first and the clear only happens if that write succeeded;
   a full quota therefore skips the reset rather than wiping with no copy. */
const RESET_STAMP = '2026-09-30-cards-rebuilt';
function applyOneTimeReset(){
  if(S.resetStamp === RESET_STAMP) return;
  const had = Object.keys(S.cards || {}).length;
  if(had){
    try{
      localStorage.setItem(KEY + '.archive-' + RESET_STAMP,
        JSON.stringify({at: Date.now(), cards: S.cards}));
    }catch(e){
      return;                      // no room for a copy, so nothing is destroyed
    }
  }
  S.cards = {};
  S.resetStamp = RESET_STAMP;
  save();
}

function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ S = null; }
  if(!S || typeof S !== 'object') S = {};
  if(!S.cards    || typeof S.cards !== 'object') S.cards = {};
  if(!Array.isArray(S.requests)) S.requests = [];
  applyOneTimeReset();
  correctForClockChange();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* Due dates are absolute epoch milliseconds, which is the phone's own clock and
   is unaffected by a VPN, by travelling, or by the timezone displayed. The one
   thing that would break them is the clock itself jumping: if the device sets
   its time backwards, every card looks as though it is due further in the
   future than it is, and nothing comes up for review. So remember the last time
   we ran, and if the clock has gone backwards by more than a few minutes, slide
   every due date by the same amount. Intervals stay relative, which is all the
   schedule ever cared about. A forward jump needs no repair: cards simply
   become due, which is what would have happened anyway. */
function correctForClockChange(){
  const now = Date.now();
  const seen = Number(S.lastSeen) || 0;
  if(seen && now < seen - 5*60000){
    const shift = seen - now;
    Object.keys(S.cards).forEach(id => {
      const c = S.cards[id];
      if(c && typeof c.due === 'number' && c.due > 0) c.due -= shift;
    });
  }
  S.lastSeen = now;
  // Persist straight away. If the corrected dates only lived in memory, the
  // stale marker would still be on disk and the next launch would measure the
  // same rollback again and shift everything a second time.
  save();
}
/* Keep the marker fresh so a rollback is measured from the last real use. */
setInterval(() => { if(S){ S.lastSeen = Date.now(); save(); } }, 60000);

/* Ask the browser not to evict this. Safari clears script-writable storage for
   sites left unused, and a flashcard app is exactly the kind of thing you leave
   alone for a fortnight. Installed to the home screen this is usually granted. */
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

function deck(){
  return (window.WORDS||[]).map(w => ({
    id: w.word,
    word: w.word, pos: w.part_of_speech, ex: w.example,
    def: w.definition,
    en: w.english_synonyms, ru: w.russian_synonyms
  }));
}

/* ============================================================
   SPACED REPETITION
   Deliberately short-term: a word you keep getting right tops
   out at 10 days rather than vanishing for a month.
   ============================================================ */
const MIN = 60000, DAY = 1440;              // DAY measured in minutes
const LEARN = [1, 10];                       // minutes
const GRADUATE = DAY;                        // first real interval: 1 day
const EASY_FIRST = 2 * DAY;                  // knew it cold on sight
const MAX_IVL = 10 * DAY;                    // ceiling: 10 days
const EASE0 = 2.2, EASE_MIN = 1.3, EASE_MAX = 2.8;

function fresh(id){ return {id, stage:'new', step:0, ivl:0, ease:EASE0, due:0, reps:0, lapses:0}; }
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* Pure: returns the next state of a card for a given answer. */
function apply(c, r, now){
  const n = Object.assign({}, c);
  n.reps++;
  if(n.stage === 'new' || n.stage === 'learning'){
    n.stage = 'learning';
    if(r === 'wrong'){ n.step = 0; n.due = now + LEARN[0]*MIN; }
    else if(r === 'hard'){
      // Hard still moves you forward, just in smaller hops than Easy —
      // otherwise a word you always find hard would loop in the learning
      // steps forever and never earn a day-scale interval.
      n.step++;
      if(n.step >= LEARN.length){ n.stage='review'; n.ivl = GRADUATE; n.due = now + n.ivl*MIN; }
      else { n.due = now + LEARN[n.step]*MIN; }
    }
    else { n.stage='review'; n.ivl = EASY_FIRST; n.due = now + n.ivl*MIN; }
  }
  else if(n.stage === 'relearn'){
    if(r === 'wrong'){ n.due = now + 5*MIN; }
    else if(r === 'hard'){ n.due = now + 10*MIN; }
    else { n.stage='review'; n.due = now + n.ivl*MIN; }
  }
  else { /* review */
    if(r === 'wrong'){
      n.lapses++; n.ease = clamp(n.ease-0.2, EASE_MIN, EASE_MAX);
      n.ivl = clamp(Math.round(n.ivl*0.4), DAY, MAX_IVL);
      n.stage = 'relearn'; n.step = 0; n.due = now + 5*MIN;
    } else if(r === 'hard'){
      n.ease = clamp(n.ease-0.15, EASE_MIN, EASE_MAX);
      // cap last, so a card sitting at the ceiling stays there
      n.ivl = Math.min(MAX_IVL, Math.max(Math.round(n.ivl*1.3), n.ivl+720));
      n.due = now + n.ivl*MIN;
    } else {
      n.ivl = Math.min(MAX_IVL, Math.max(Math.round(n.ivl*n.ease), n.ivl+DAY));
      n.ease = clamp(n.ease+0.1, EASE_MIN, EASE_MAX);
      n.due = now + n.ivl*MIN;
    }
  }
  return n;
}

/* How long until this card comes back, in words. */
function gap(c, r, now){
  const n = apply(c, r, now);
  return human(Math.round((n.due - now)/MIN));
}
function human(m){
  if(m < 60) return Math.max(1,Math.round(m)) + 'm';
  if(m < DAY) return Math.round(m/60) + 'h';
  const d = m/DAY;
  return (d < 10 ? +d.toFixed(d % 1 && d < 3 ? 1 : 0) : Math.round(d)) + 'd';
}

/* ============================================================
   QUEUE
   ============================================================ */
function stateOf(id){ return S.cards[id] || null; }
function counts(){
  const now = Date.now(), all = deck();
  let due = 0, neu = 0, known = 0;
  all.forEach(w => {
    const c = stateOf(w.id);
    if(!c){ neu++; return; }
    if(c.due <= now) due++;
    if(c.stage === 'review') known++;
  });
  return {due, neu, known, total: all.length};
}
function pickNext(){
  const now = Date.now(), all = deck();
  const seen = all.filter(w => stateOf(w.id)).map(w => ({w, c: stateOf(w.id)}));
  const ready = seen.filter(x => x.c.due <= now).sort((a,b) => a.c.due - b.c.due);
  if(ready.length) return ready[0];
  // A card you just answered must not come straight back, so an unseen word
  // takes priority over one that is merely due soon.
  const first = all.find(w => !stateOf(w.id));
  if(first) return {w: first, c: fresh(first.id)};
  // Only once the deck is exhausted is it worth showing a learning card early,
  // rather than parking you on "all caught up" for the sake of a few minutes.
  const soon = seen
    .filter(x => (x.c.stage==='learning'||x.c.stage==='relearn') && x.c.due - now <= 20*MIN)
    .sort((a,b) => a.c.due - b.c.due);
  if(soon.length) return soon[0];
  return null;
}
function nextDueText(){
  const now = Date.now();
  const times = deck().map(w => stateOf(w.id)).filter(Boolean).map(c => c.due).filter(t => t > now);
  if(!times.length) return 'Nothing left to review.';
  return 'Next card in ' + human(Math.round((Math.min.apply(null,times) - now)/MIN)) + '.';
}

/* ============================================================
   SPEECH
   Every headword ships as an MP3 in audio/, spoken by a British
   female voice (Cori, LibriVox) rendered offline with Piper.
   That is the whole point: iOS defaults to a compact voice that
   sounds robotic, and the only way to improve it on the device is
   to go and download one in Settings. Shipping the clips means the
   app sounds the same on every phone and works with no signal.
   The phone's own engine is kept only as a fallback for anything
   with no clip, which today is nothing.
   ============================================================ */
const CLIP_DIR = 'audio/';
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

/* One element, reused: iOS only lets audio start inside a user gesture, and a
   single element that has already played once stays unlocked. */
const clip = new Audio();
clip.preload = 'auto';

/* Pick a British female voice. Left to itself iOS grabs Daniel, the default
   en-GB voice, which is the deep robotic one. Named voices differ per device
   and per OS version, so score candidates rather than hard-coding one. */
const FEMALE = /serena|kate|stephanie|martha|sonia|libby|hazel|fiona|moira|tessa|samantha|karen|zira|susan|catherine|linda|amy|emma|jenny|aria|ava|clara|female/i;
const MALE   = /daniel|arthur|oliver|george|ryan|thomas|alex|fred|gordon|rishi|aaron|david|mark|james|guy|eric|christopher|brandon|liam|nathan|william|male/i;

let voice = null;
function pickVoice(){
  const all = speechSynthesis.getVoices()
    .filter(v => v.lang && v.lang.replace('_','-').toLowerCase().indexOf('en') === 0);
  if(!all.length) return;
  /* Voice names differ wildly per device, so score rather than hard-code.
     The quality tier hides in the voiceURI, not the name: iOS ships
     com.apple.voice.compact.en-GB.Daniel by default and only exposes
     ...voice.enhanced.en-GB.Serena once that voice has been downloaded.
     Both are called "Serena"/"Daniel" in .name, so the URI has to be read
     or the robotic compact one wins on a tie. */
  const score = v => {
    const lang = v.lang.replace('_','-');
    const uri  = (v.voiceURI || '') + ' ' + v.name;
    let s = 0;
    if(lang === 'en-GB') s += 100;
    else if(/^en-(AU|IE|NZ|ZA)$/i.test(lang)) s += 40;
    if(FEMALE.test(v.name)) s += 60;
    else if(MALE.test(v.name)) s -= 80;      // checked second so "female" never reads as "male"
    if(/premium|enhanced|natural|neural|siri/i.test(uri)) s += 45;
    if(/compact|eloquence|novelty/i.test(uri)) s -= 30;
    if(v.localService) s += 5;
    return s;
  };
  voice = all.slice().sort((a,b) => score(b) - score(a))[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function synthesise(text){
  if(!('speechSynthesis' in window) || !text) return;
  if(!voice) pickVoice();               // iOS often fills the list only after first use
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (voice && voice.lang) || 'en-GB';
  u.rate = .92; u.pitch = 1;
  if(voice) u.voice = voice;
  u.onstart = () => busy(true);
  u.onend = u.onerror = () => busy(false);
  speechSynthesis.speak(u);
}
function busy(on){ const b = $('spk'); if(b) b.classList.toggle('speaking', on); }

function speak(text){
  if(!text) return;
  const src = CLIP_DIR + slug(text) + '.mp3';
  try{ speechSynthesis.cancel(); }catch(e){}
  // Re-pointing src at the same file still restarts it, so a second tap
  // replays rather than doing nothing.
  clip.src = src;
  clip.currentTime = 0;
  clip.onplaying = () => busy(true);
  clip.onended = () => busy(false);
  clip.onerror = () => { busy(false); synthesise(text); };   // no clip for this word
  const p = clip.play();
  if(p && p.catch) p.catch(() => { busy(false); synthesise(text); });
}

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);
let current = null, flipped = false, undoSnap = null;

function show(name){
  ['home','study','done'].forEach(s => $(s).classList.toggle('on', s === name));
  $('fab').style.display = (name === 'study') ? 'none' : 'grid';
  if(name === 'home') refreshHome();
}
/* The three figures count up to their values as the screen assembles. Cosmetic:
   the real number is written at the end whatever happens in between. */
function countUp(el, to){
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(calm || !to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 520;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(step); else el.textContent = to;
  };
  requestAnimationFrame(step);
}
function refreshHome(){
  const k = counts();
  countUp($('sDue'), k.due); countUp($('sNew'), k.neu); countUp($('sKnown'), k.known);
  $('goStudy').textContent = (k.due + k.neu) ? 'Start' : 'Review anyway';
}

/* Written out in full: "ADJ" and "PREP" are extra decoding work for someone
   reading in a second language. */
const POS = {
  adj:'adjective', adv:'adverb', v:'verb', n:'noun',
  prep:'preposition', conj:'conjunction', phrase:'phrase', idiom:'idiom'
};
function posName(p){
  const k = String(p || '').trim().toLowerCase();
  return POS[k] || k;
}

/* Example sentences mark the target word with *asterisks* in words.csv,
   so the highlight lands on the right span whatever form the word takes
   (exacerbate -> *exacerbated*). Built as nodes, never innerHTML. */
function renderExample(el, text){
  el.textContent = '';
  if(!text) return;
  text.split(/(\*[^*]+\*)/).forEach(part => {
    if(!part) return;
    if(part[0] === '*' && part.length > 2){
      const s = document.createElement('span');
      s.className = 'hl';
      s.textContent = part.slice(1, -1);
      el.appendChild(s);
    } else el.appendChild(document.createTextNode(part));
  });
}

/* ---------- THE SKY ----------
   Built once, from a fixed seed, so the same stars sit in the same places on
   every launch - a sky you half-recognise rather than a new one each time.
   Positions are percentages, so a rotation or a keyboard does not move them.
   48 is enough to read as a sky at arm's length and few enough that 48 opacity
   animations cost nothing measurable. */
(function buildSky(){
  const sky = document.getElementById('sky');
  if(!sky) return;
  let seed = 20260930;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const frag = document.createDocumentFragment();
  for(let n = 0; n < 48; n++){
    const i = document.createElement('i');
    const size = (rnd() * 1.3 + 1).toFixed(2);
    i.style.left   = (rnd() * 100).toFixed(2) + '%';
    i.style.top    = (rnd() * 100).toFixed(2) + '%';
    i.style.width  = size + 'px';
    i.style.height = size + 'px';
    i.style.setProperty('--o', (rnd() * 0.38 + 0.22).toFixed(2));
    i.style.setProperty('--t', (rnd() * 4.2 + 2.8).toFixed(2) + 's');
    i.style.setProperty('--d', (rnd() * -7).toFixed(2) + 's');   // negative: already mid-cycle
    frag.appendChild(i);
  }
  sky.appendChild(frag);

  /* Every so often one crosses. Only at night, only while the app is on screen,
     never with reduced motion, and the element removes itself when it is done. */
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(calm) return;
  const shoot = () => {
    const night = document.documentElement.getAttribute('data-palette') === 'pine';
    if(night && !document.hidden){
      const s = document.createElement('i');
      s.className = 'shoot';
      s.style.left = (8 + Math.random() * 44) + '%';
      s.style.top  = (4 + Math.random() * 30) + '%';
      sky.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }
    setTimeout(shoot, 16000 + Math.random() * 26000);
  };
  setTimeout(shoot, 7000 + Math.random() * 9000);
})();

/* ============================================================
   CONTEXT ROTATION
   ============================================================ */
/* Every card carries up to ten sentences. Each time a card comes up it shows
   the next one, wrapping at the end, so a word is met in a different setting
   every time rather than welded to one sentence. The cursor is per word and
   lives under its OWN key: it is a display detail, and the progress key is not
   somewhere to put display details. Losing this file costs a user nothing but
   starting the rotation over. */
const CTX_KEY = 'vocab.ctx';
let CTX = {};
try{ CTX = JSON.parse(localStorage.getItem(CTX_KEY) || '{}') || {}; }catch(e){ CTX = {}; }
function saveCtx(){ try{ localStorage.setItem(CTX_KEY, JSON.stringify(CTX)); }catch(e){} }

function contextsFor(word){
  const list = (window.CONTEXTS && window.CONTEXTS[word]) || null;
  if(list && list.length) return list;
  return null;
}
/* Returns the next sentence for this word and advances the cursor. Falls back
   to the word's own example when it has no context list yet, so a half-filled
   contexts file still shows a sentence on every card. */
function nextContext(w){
  const list = contextsFor(w.word);
  if(!list) return w.ex || '';
  const i = ((Number(CTX[w.word]) || 0) % list.length + list.length) % list.length;
  CTX[w.word] = (i + 1) % list.length;
  saveCtx();
  return list[i];
}

/* ============================================================
   MORE
   ============================================================ */
function closeMore(){
  const p = $('morePanel'), b = $('moreBtn');
  if(!p || !b) return;
  p.hidden = true;
  b.textContent = 'more';
  b.classList.remove('open');
  b.setAttribute('aria-expanded', 'false');
  b.setAttribute('aria-label', 'Show the definition');
}
function toggleMore(e){
  /* the card flips on a tap anywhere, so this must not reach it */
  if(e){ e.stopPropagation(); e.preventDefault(); }
  const p = $('morePanel'), b = $('moreBtn');
  if(!p || !b) return;
  const open = p.hidden;
  p.hidden = !open;
  b.textContent = open ? '\u2715' : 'more';
  b.classList.toggle('open', open);
  b.setAttribute('aria-expanded', String(open));
  b.setAttribute('aria-label', open ? 'Hide the definition' : 'Show the definition');
}

/* A clip for the word, if one has been added to gifs.json. Nothing is fetched
   from a third party: the app is offline-first and a public page should not be
   pulling film clips it has no licence to. An empty slot simply says so. */
let GIFS = null;
function renderGif(el, word){
  el.textContent = '';
  const credit = $('mGifCredit');
  if(credit) credit.hidden = true;
  const src = GIFS && GIFS[word];
  if(!src) return;                 // no clip: the box collapses, nothing is said
  const img = document.createElement('img');
  img.loading = 'lazy'; img.alt = ''; img.src = src;
  el.appendChild(img);
  const c = $('mGifCredit');
  if(c) c.hidden = false;
}
fetch('gifs.json').then(r => r.ok ? r.json() : null)
  .then(j => { GIFS = j || {}; }).catch(() => { GIFS = {}; });

/* The entry on the More panel: the headword as a title, its sense beneath.
   textContent rather than innerHTML, like everything else that touches word data. */
function renderEntry(el, w){
  const t = $('mWord');
  if(t){
    t.textContent = w.word;
    // idioms are whole phrases, so the title steps down by length as the
    // headword on the front does
    t.className = 'more-word' +
      (w.word.length > 24 ? ' longer' : w.word.length > 15 ? ' long' : '');
  }
  el.textContent = w.def || '';
}

/* The possible Russian translations, under the Russian definition and carrying
   the same green highlight the target word carries inside the sentence on the
   front. No label above them: on a card with two languages and nothing else,
   a heading saying which is which is a word you have to read past. */
function renderRussian(el, list){
  el.textContent = '';
  String(list || '').split(',').map(s => s.trim()).filter(Boolean).forEach(t => {
    const s = document.createElement('span');
    s.className = 'hl';
    s.textContent = t;
    el.appendChild(s);
  });
}

function render(){
  current = pickNext();
  if(!current){ $('doneSub').textContent = nextDueText(); show('done'); return; }
  const {w, c} = current;
  flipped = false;
  const card = $('card');
  card.classList.add('noanim');
  card.classList.remove('flipped');
  void card.offsetWidth;                    // commit the snap before animation returns
  card.classList.remove('noanim');
  $('answers').classList.remove('on');
  $('hint').style.display = '';

  $('fWord').textContent = w.word;
  $('fWord').className = 'front-word' +
    (w.word.length > 24 ? ' longer' : w.word.length > 15 ? ' long' : '');
  $('fPos').textContent = posName(w.pos);

  closeMore();
  renderExample($('bCtx'), nextContext(w));
  renderRussian($('bRu'), w.ru);
  renderEntry($('mDef'), w);
  $('mSyn').textContent = w.en || '';
  renderGif($('mGif'), w.word);

  const now = Date.now();
  $('tW').textContent = '(' + gap(c,'wrong',now) + ')';
  $('tH').textContent = '(' + gap(c,'hard', now) + ')';
  $('tE').textContent = '(' + gap(c,'easy', now) + ')';

  const k = counts();
  $('cDue').textContent = k.due; $('cNew').textContent = k.neu;
  $('undo').disabled = !undoSnap;
  document.querySelectorAll('.back-half').forEach(h => h.scrollTop = 0);
}

function flip(){
  if(!current) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('answers').classList.toggle('on', flipped);
  $('hint').style.display = flipped ? 'none' : '';
}

/* The answer is written to storage BEFORE anything moves. The animation is
   decoration on top of a finished save, so closing the app mid-deal costs
   nothing. `dealing` only stops a second tap landing while the card is in the
   air, and it is released on a timer as well as on the animation's own end:
   an event that never fires must not be able to leave the app stuck. */
const CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let dealing = false;

function dealIn(){
  if(CALM) return;
  const wrap = $('cardWrap');
  wrap.classList.remove('enter');
  void wrap.offsetWidth;
  wrap.classList.add('enter');
  setTimeout(() => wrap.classList.remove('enter'), 340);
}
function dealNext(r){
  const wrap = $('cardWrap');
  if(CALM){ render(); return; }
  dealing = true;
  let moved = false;
  const next = () => {
    if(moved) return;
    moved = true;
    wrap.classList.remove('leave-wrong', 'leave-hard', 'leave-easy');
    render();
    dealIn();
    setTimeout(() => { dealing = false; }, 120);
  };
  wrap.addEventListener('animationend', next, {once: true});
  setTimeout(next, 280);                       // the event is a hint, the timer is the guarantee
  wrap.classList.add('leave-' + r);
}

function answer(r){
  if(!current || !flipped || dealing) return;
  const {w, c} = current;
  undoSnap = {id: w.id, prev: S.cards[w.id] ? JSON.parse(JSON.stringify(S.cards[w.id])) : null};
  S.cards[w.id] = apply(c, r, Date.now());
  save();
  dealNext(r);
}

/* events */
$('cardWrap').addEventListener('click', e => { if(!e.target.closest('#spk')) flip(); });
/* pointerdown, not click: on iOS the speech engine is happiest when it is
   started by the first event of the gesture, and this also settles the tap
   before the card can interpret it. */
$('spk').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  if(current) speak(current.w.word);
});
$('spk').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
document.querySelectorAll('.ans').forEach(b => b.addEventListener('click', () => answer(b.dataset.r)));
$('back').addEventListener('click', () => show('home'));
$('doneHome').addEventListener('click', () => show('home'));
$('goStudy').addEventListener('click', () => { undoSnap = null; show('study'); render(); dealIn(); });
$('undo').addEventListener('click', () => {
  if(!undoSnap) return;
  if(undoSnap.prev) S.cards[undoSnap.id] = undoSnap.prev; else delete S.cards[undoSnap.id];
  undoSnap = null; save(); render();
});
/* ============================================================
   REQUEST A WORD
   The request goes to Elijah's buffer worker, which pings him on
   Telegram. A request counts as "added" the moment the word turns up in
   the deck, so no reply channel is needed: publishing the word is the
   answer. Anything that fails to send stays queued and retries, since
   this gets used on a phone with patchy signal.
   ============================================================ */
const REQUEST_URL = 'https://claude-buffer.elijahrobineau.workers.dev/word-request';

function isInDeck(text){
  const t = text.trim().toLowerCase();
  return (window.WORDS || []).some(w => w.word.toLowerCase() === t);
}
function openSheet(){
  $('sheetBg').classList.add('on'); $('sheet').classList.add('on');
  $('reqInput').value = ''; $('reqSend').disabled = true;
  renderRequests(); flushQueue();
}
function closeSheet(){
  $('sheetBg').classList.remove('on'); $('sheet').classList.remove('on');
  $('reqInput').blur();
}
function renderRequests(){
  const list = $('mine');
  list.textContent = '';
  if(!S.requests.length) return;
  S.requests.slice().reverse().forEach(r => {
    const added = isInDeck(r.text);
    const row = document.createElement('div'); row.className = 'item';
    const p = document.createElement('p'); p.textContent = r.text;
    const tag = document.createElement('span');
    tag.className = 'status ' + (added ? 'added' : 'pending');
    tag.textContent = added ? '✓ added' : (r.sent ? 'pending' : 'not sent yet');
    row.appendChild(p); row.appendChild(tag); list.appendChild(row);
  });
}
const inflight = new Set();   // a send in progress is not yet "sent", but must not be repeated
function flushQueue(){
  S.requests.filter(r => !r.sent && !inflight.has(r.text)).forEach(r => {
    inflight.add(r.text);
    fetch(REQUEST_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({word: r.text, at: r.ts})
    }).then(res => {
      if(res.ok){ r.sent = true; save(); renderRequests(); }
    }).catch(() => {})        // stays queued, retried next time the sheet opens
      .then(() => inflight.delete(r.text));
  });
}
/* ---------- SUN AND MOON ----------
   Heartwood by day, understorey at night, switched by hand and remembered under its
   own key. THEME_KEY is not KEY and must never become it: this writes one
   short string and touches nothing the scheduler owns. */
const THEME_KEY = 'vocab.theme';
const SUN_ICON  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-14.5 1.6 2.7h-3.2zM12 21.5l-1.6-2.7h3.2zM2.5 12l2.7-1.6v3.2zM21.5 12l-2.7 1.6v-3.2zM5.2 5.2l3.1.4-1.6 1.6zM18.8 18.8l-3.1-.4 1.6-1.6zM18.8 5.2l-1.5 3.1-1.6-1.6zM5.2 18.8l1.5-3.1 1.6 1.6z"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 14.6A8.6 8.6 0 0 1 9.4 3.3 8.7 8.7 0 1 0 20.7 14.6z"/></svg>';

const THEME_BTNS = ['themeBtn', 'themeBtnStudy'];

/* the light the PHONE is in, which is what the app follows by default */
function systemPalette(){
  return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
    ? 'pine' : 'heartwood';
}
/* An override survives only while the phone is still in the light it was made
   in. Once the phone flips, it is dropped and we are back to following it. */
function resolvePalette(){
  const sys = systemPalette();
  try{
    const o = JSON.parse(localStorage.getItem(THEME_KEY) || 'null');
    if(o && o.basis === sys && (o.pal === 'heartwood' || o.pal === 'pine')) return o.pal;
    if(o) localStorage.removeItem(THEME_KEY);
  }catch(e){}
  return sys;
}
function applyPalette(pal){
  document.documentElement.setAttribute('data-palette', pal);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', (pal === 'heartwood') ? '#E0CFAE' : '#0A120D');
  /* The icon shows the light you are IN: sun while the app is light, moon
     while it is dark. Not the light you would switch to. */
  const icon  = (pal === 'heartwood') ? SUN_ICON : MOON_ICON;
  const label = (pal === 'heartwood') ? 'Light. Switch to dark' : 'Dark. Switch to light';
  THEME_BTNS.forEach(id => {
    const b = $(id);
    if(!b) return;
    b.innerHTML = icon;
    b.setAttribute('aria-label', label);
  });
}
function toggleTheme(){
  const next = (document.documentElement.getAttribute('data-palette') === 'heartwood')
    ? 'pine' : 'heartwood';
  try{
    localStorage.setItem(THEME_KEY, JSON.stringify({pal: next, basis: systemPalette()}));
  }catch(e){}
  applyPalette(next);
}
THEME_BTNS.forEach(id => {
  const b = $(id);
  if(b) b.addEventListener('click', toggleTheme);
});
/* If the phone changes light while the app is open, re-resolve rather than sit
   there: that flip is exactly the moment an override is meant to expire. */
if(window.matchMedia){
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onScheme = () => applyPalette(resolvePalette());
  if(mq.addEventListener) mq.addEventListener('change', onScheme);
  else if(mq.addListener) mq.addListener(onScheme);
}
applyPalette(resolvePalette());

$('moreBtn').addEventListener('click', toggleMore);
$('moreClose').addEventListener('click', toggleMore);

$('fab').addEventListener('click', openSheet);
$('sheetBg').addEventListener('click', closeSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('reqInput').addEventListener('input', function(){
  $('reqSend').disabled = !this.value.trim();
});
$('reqInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && this.value.trim()) $('reqSend').click();
});
$('reqSend').addEventListener('click', () => {
  const text = $('reqInput').value.trim().slice(0, 60);
  if(!text) return;
  if(!S.requests.some(r => r.text.toLowerCase() === text.toLowerCase())){
    S.requests.push({text, ts: new Date().toISOString(), sent: false});
    save();
  }
  $('reqInput').value = ''; $('reqSend').disabled = true;
  renderRequests(); flushQueue();
});

/* go */
load(); show('home');

/* ---- offline shell, and updating itself ----
   Installed to the home screen, this app can sit suspended for days: iOS keeps
   the page alive, so nothing is ever re-fetched and a new version only arrives
   if you force-quit.

   The first attempt at fixing that reloaded as soon as a new worker took over.
   It worked, and it was horrible: the reload happened while the app was on
   screen and under a thumb, so for a second every button was dead. A silent
   reload is not silent if you are looking at it.

   So the rule now is: NEVER reload a page the user can see. An update waits,
   and is applied at a moment that already looks like the app starting.

     - while the app is in the foreground: nothing happens, however long it sits
     - the moment it goes to the background: reload, out of sight
     - if the phone froze the page before that could happen, reload the instant
       it comes back, before the user has touched anything, which is
       indistinguishable from a normal launch
     - if they never background it at all, the pill appears after a few minutes
       so the choice is at least offered

   Reloading is safe at any point: every answer is written to storage as it is
   given, so a reload cannot cost a review. */
if('serviceWorker' in navigator){
  const PILL_AFTER = 4 * 60 * 1000;
  let waiting = null, updateReady = false, applying = false, pillTimer = null, navigated = false;
  let resumedAt = Date.now(), touchedSinceResume = false;

  /* THE RULE THIS IS BUILT AROUND: never reload a page that is hidden, and
     never reload from pagehide.
     That is what the old version did, on the theory that swapping versions
     while nobody is looking is invisible. On iOS it is not invisible, it is
     fatal: the browser freezes the page part-way through the navigation and
     what you come back to is a half-torn-down document that paints but does
     not respond. That is the freeze, and the only way out of it was to force
     quit. So the reload now happens only when the app is on screen, and the
     user is told it is happening. */
  const safeMoment = () =>
    !document.hidden && !touchedSinceResume && (Date.now() - resumedAt) < 15000;

  function applyUpdate(){
    if(applying || document.hidden) return;
    applying = true;
    clearTimeout(pillTimer);
    $('updatePill').hidden = true;
    $('updating').hidden = false;          // say what is happening, always

    const go = () => {
      if(navigated) return;
      navigated = true;
      location.reload();
    };
    /* Ask the waiting worker to take over, and reload once it has. If no worker
       is waiting, or it never answers, reload anyway: a stale page that
       refreshes is a far smaller problem than a page that sits there. */
    navigator.serviceWorker.addEventListener('controllerchange', go, {once: true});
    if(waiting){ try{ waiting.postMessage({type: 'SKIP_WAITING'}); }catch(e){} }
    setTimeout(go, 2000);

    /* And if even the reload did not take - which is what a frozen navigation
       looks like from in here - stop pretending. Put the app back, put the
       pill back, and let the user tap it. Nothing latches. */
    setTimeout(() => {
      if(navigated && document.visibilityState !== 'visible') return;
      applying = false;
      $('updating').hidden = true;
      if(updateReady) $('updatePill').hidden = false;
    }, 7000);
  }

  function markUpdateReady(worker){
    if(worker) waiting = worker;
    if(updateReady) return;
    updateReady = true;
    if(safeMoment()){ applyUpdate(); return; }
    // they are mid-review: leave them alone, and offer the choice if they
    // never look away for long enough to take it quietly
    pillTimer = setTimeout(() => {
      if(updateReady && !applying) $('updatePill').hidden = false;
    }, PILL_AFTER);
  }
  window.markUpdateReady = markUpdateReady;      // the hook the tests drive

  // pointerdown as well as click: on iOS a click can be swallowed if anything
  // above the pill claims the gesture, and this button must never feel dead
  const tapPill = e => { if(e) e.preventDefault(); applying = false; applyUpdate(); };
  $('updatePill').addEventListener('pointerdown', tapPill);
  $('updatePill').addEventListener('click', tapPill);
  document.addEventListener('pointerdown', e => {
    if(e.target.closest && e.target.closest('#updatePill')) return;
    touchedSinceResume = true;
  }, true);

  /* Coming back is the moment to do it: the app is on screen, nothing has been
     touched, and a reload there is indistinguishable from a launch. Going away
     is NOT the moment, which is the whole point of the rule above. */
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) return;
    resumedAt = Date.now();
    touchedSinceResume = false;
    if(updateReady) applyUpdate();
  });

  window.addEventListener('load', () => {
    // updateViaCache:'none' so the check is a real check: otherwise the browser
    // may answer it from its own HTTP cache and find nothing new for hours
    navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(reg => {
      // a worker already sitting waiting from a previous visit
      if(reg.waiting && navigator.serviceWorker.controller) markUpdateReady(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          // installed AND something was already in charge: that is an update,
          // not a first install
          if(nw.state === 'installed' && navigator.serviceWorker.controller) markUpdateReady(nw);
        });
      });
      const check = () => { try{ reg.update(); }catch(e){} };
      document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
      window.addEventListener('focus', check);
      setInterval(check, 30 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
